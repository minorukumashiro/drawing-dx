<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--tx:#f5f5f7;--tx2:#aeaeb2;--tx3:#636366;--bd:#48484a;--ac:#0a84ff;--ac2:#0a2a4a;--ac3:#66b3ff;--gn:#30d158;--gn2:#0d2e1a;--am:#ffd60a;--am2:#2e2500;--rd:#ff453a;--rd2:#3a0e0e;--r:12px;--font:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;--shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4)}
body{font-family:var(--font);background:var(--bg2);color:var(--tx);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:1400px;margin:0 auto;padding:20px 24px}

/* Navigation */
.nav{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--bg);border-radius:16px;margin-bottom:20px;box-shadow:var(--shadow);flex-wrap:wrap}
.nav-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0066CC,#004999);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,102,204,.3)}
.nav-title{font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--tx)}
.nav-sub{font-size:11px;color:var(--tx3);letter-spacing:.2px}
.nav-tabs{display:flex;gap:3px;margin-left:auto;background:var(--bg2);border-radius:10px;padding:3px;flex-wrap:wrap}
.nav-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--tx3);transition:all .2s ease}
.nav-tab:hover{color:var(--tx2);background:var(--bg3)}
.nav-tab.active{background:var(--bg);color:var(--ac);box-shadow:var(--shadow);font-weight:600}

/* Section Title */
.section-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;position:relative}
.kpi{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;transition:all .2s ease;box-shadow:var(--shadow)}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi-label{font-size:11px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.kpi-val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi-val small{font-size:12px;font-weight:400;color:var(--tx3)}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.board-col{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px;min-height:200px;box-shadow:var(--shadow)}
.board-col-head{font-size:12px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--bg3)}
.board-col-head .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.board-col-head .cnt{margin-left:auto;font-size:10px;color:var(--tx3);font-weight:500;background:var(--bg2);padding:1px 8px;border-radius:10px}
.board-card{background:var(--bg2);border:1px solid transparent;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s ease;font-size:12px}
.board-card:hover{border-color:var(--ac);background:#2a3a4a;box-shadow:0 2px 8px rgba(10,132,255,.15)}
.board-card .bc-title{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--tx)}
.board-card .bc-meta{color:var(--tx3);font-size:11px}
.board-card .bc-tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.board-card .bc-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.g-card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s ease;box-shadow:var(--shadow)}
.g-card:hover{border-color:var(--ac);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.g-thumb{display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:10px;min-height:88px;overflow:hidden}
.g-name{font-weight:600;font-size:13px;line-height:1.3}
.g-meta{font-size:11px;color:var(--tx3);margin-top:3px}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:4px;flex-wrap:wrap}
.g-cat{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--tx2);font-weight:500}
.g-btn{padding:4px 10px;border-radius:6px;border:none;background:var(--ac2);color:var(--ac);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s}
.g-btn:hover{background:var(--ac);color:#fff}

/* Badges */
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;vertical-align:middle;margin-left:4px}
.badge-scan{background:var(--gn2);color:var(--gn)}
.badge-pdf{background:var(--rd2);color:var(--rd)}

/* Search Results */
.res-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .2s ease;box-shadow:var(--shadow)}
.res-item:hover{border-color:var(--ac);box-shadow:var(--shadow-md)}
.res-rank{font-size:13px;color:var(--tx3);font-weight:700;min-width:24px}
.res-thumb{background:var(--bg2);border-radius:8px;padding:4px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.res-info{flex:1;min-width:0}
.res-name{font-weight:600;font-size:13px}
.res-detail{font-size:11px;color:var(--tx2);margin-top:2px}
.sim-wrap{min-width:120px;display:flex;align-items:center;gap:8px}
.sim-bar{flex:1;height:6px;border-radius:3px;background:var(--bg3)}
.sim-fill{height:100%;border-radius:3px;transition:width .6s ease}
.sim-pct{font-size:13px;font-weight:700;min-width:40px;text-align:right}
.res-price{text-align:right;min-width:70px;font-size:12px}
.res-price b{display:block;font-size:14px}

/* Drop Zone */
.drop{border:2px dashed var(--bd);border-radius:var(--r);padding:32px;text-align:center;background:var(--bg);cursor:pointer;transition:all .25s ease;margin-bottom:16px}
.drop:hover{border-color:var(--ac);background:var(--ac2)}
.drop.over{border-color:var(--ac);background:var(--ac2)}
.drop h3{font-size:14px;font-weight:500;margin-top:8px;color:var(--tx2)}
.drop p{font-size:11px;color:var(--tx3);margin-top:4px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:p 1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* Modals */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--bg3)}
.modal-head h2{font-size:17px;font-weight:700}
.modal-foot{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--bg3)}
.modal-foot button{flex:1;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-cancel{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}
.btn-cancel:hover{background:var(--bg3)}
.btn-save{background:var(--ac);color:#fff;border:none}
.btn-save:hover{background:var(--ac3)}
.btn-save:disabled{opacity:.4;cursor:not-allowed}
.close-btn{background:none;border:none;cursor:pointer;font-size:22px;color:var(--tx3);padding:4px;transition:color .15s}
.close-btn:hover{color:var(--tx)}

/* Forms */
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.f-field label{display:block;font-size:11px;color:var(--tx2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.f-field input,.f-field select,.f-field textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--bg);color:var(--tx);outline:none;font-family:var(--font);transition:all .15s}
.f-field input::placeholder,.f-field textarea::placeholder{color:var(--tx3)}
.f-field select option{background:var(--bg2);color:var(--tx)}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
.f-field textarea{resize:vertical;min-height:50px}
.ocr-filled{border-color:var(--gn)!important;background:#0d2e1a!important;color:var(--tx)!important}
.ocr-tag{font-size:9px;color:var(--gn);margin-left:4px;font-weight:700;text-transform:uppercase}

/* Upload */
.upload-area{border:2px dashed var(--bd);border-radius:var(--r);padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:16px;position:relative;overflow:hidden;transition:all .25s ease}
.upload-area:hover{border-color:var(--ac);background:var(--ac2)}
.upload-area.has{border-style:solid;border-color:var(--gn);background:#f4fbf7}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.ocr-bar{margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:10px;font-weight:500}
.ocr-bar.run{background:#E5F0FF;color:#0066CC}
.ocr-bar.ok{background:var(--gn2);color:var(--gn)}

/* Side Panel */
.side-bg{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end}
.side-dim{position:absolute;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(2px)}
.side{position:relative;width:460px;max-width:94vw;height:100%;background:var(--bg);border-left:1px solid var(--bd);overflow-y:auto;padding:24px;box-shadow:-8px 0 32px rgba(0,0,0,.1)}
.side h2{font-size:18px;font-weight:700;margin-top:4px}
.side-thumb{display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:var(--r);padding:20px;margin:18px 0;min-height:400px;max-height:70vh;overflow:hidden}
.side-thumb img{max-width:100%;max-height:65vh;object-fit:contain}
.side-fields{background:var(--bg2);border-radius:var(--r);padding:16px;margin-bottom:18px}
.side-field{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.side-field:last-child{border-bottom:none}
.side-field .fl{color:var(--tx2);font-weight:500}
.side-field .fv{font-weight:600}
.side-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.side-tag{padding:3px 10px;border-radius:8px;border:1px solid var(--bd);font-size:11px;color:var(--tx2);font-weight:500;background:var(--bg2)}
.side-actions{display:flex;gap:8px;flex-wrap:wrap}
.side-actions button{flex:1;min-width:80px;padding:10px 0;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.side-actions button:hover{opacity:.85;transform:translateY(-1px)}
.btn-ac{background:var(--ac2);color:var(--ac)}

/* Invoice */
.inv-preview{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:28px;margin-bottom:16px;font-size:13px;box-shadow:var(--shadow)}
.inv-preview h3{font-size:18px;font-weight:700;text-align:center;margin-bottom:18px;letter-spacing:3px}
.inv-table{width:100%;border-collapse:collapse;margin:14px 0}
.inv-table th,.inv-table td{border:1px solid var(--bd);padding:8px 12px;text-align:left;font-size:12px}
.inv-table th{background:var(--bg2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}

/* Annotation Toolbar */
.anno-toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;background:var(--bg);padding:8px;border-radius:10px;border:1px solid var(--bd);box-shadow:var(--shadow)}
.anno-toolbar button{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx2);transition:all .15s}
.anno-toolbar button:hover{background:var(--bg2)}
.anno-toolbar button.active{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(0,102,204,.3)}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar input{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;font-size:13px;background:var(--bg);outline:none;flex:1;max-width:260px;transition:all .15s;box-shadow:var(--shadow)}
.filter-bar input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,102,204,.1)}
.f-btn{padding:5px 12px;border-radius:8px;font-size:11px;cursor:pointer;border:none;font-weight:600;transition:all .15s}
.f-btn.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(0,102,204,.2)}
.f-btn.off{background:var(--bg);color:var(--tx3);border:1px solid var(--bd)}
.f-btn.off:hover{color:var(--tx2);background:var(--bg3)}

/* Canvas */
.empty-msg{text-align:center;padding:2.5rem;color:var(--tx3);font-size:13px}
canvas{display:block;border-radius:var(--r);border:1px solid var(--bd)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:9999;opacity:0;transition:all .25s ease;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr 1fr}.nav-tabs{margin-left:0;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}.f-row{grid-template-columns:1fr}.side{width:100%;max-width:100vw}}
@media(max-width:500px){.board{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.sim-wrap{min-width:80px}.res-price{display:none}.nav{padding:12px 14px}.nav-tabs{gap:2px;padding:2px}.nav-tab{padding:6px 10px;font-size:11px}.kpi-row{grid-template-columns:1fr 1fr}.kpi-val{font-size:20px}.side-actions{flex-wrap:wrap}.side-actions button{min-width:60px;font-size:11px;padding:8px 0}.app{padding:12px}}
</style>
</head>

<script>

var fbApp=null,fbDB=null,fbEnabled=false,fbSyncing=false,fbUnsubscribe=null,fbLastLocalChange=0;
// 直近のローカル ステータス変更を一定時間優先する（他端末の古いデータによる上書き＝戻り を防ぐ）
var pendingStatusEdits={}; // id -> {status, lastAccess, until}
var PENDING_STATUS_TTL=30000;
function markStatusEdit(id,status,lastAccess){pendingStatusEdits[String(id)]={status:status,lastAccess:lastAccess,until:Date.now()+PENDING_STATUS_TTL};}
// 直近のローカル削除を一定時間優先する（他端末/ウォッチャーの古いデータで待機案件が復活＝削除失敗 を防ぐ）
var pendingDeletes={}; // id -> {num, until}  num=図番（id再利用による別案件の誤削除を防ぐ照合用）
function markDeleteEdit(id,num){pendingDeletes[String(id)]={num:num||'',until:Date.now()+PENDING_STATUS_TTL};}
// Force re-sync all images on first push after this version (better quality)
window._fbSyncedImages={};

// ========== 自動JSONバックアップ ==========
var _autoSaveHandle=null;
var _autoSaveTimer=null;

async function setupAutoSave(){
  if(!window.showSaveFilePicker){alert('自動保存はChrome/Edgeのみ対応しています。');return}
  try{
    var handle=await window.showSaveFilePicker({
      suggestedName:'dxp_autosave.json',
      types:[{description:'JSONバックアップ',accept:{'application/json':['.json']}}]
    });
    _autoSaveHandle=handle;
    dbPut('meta','_autoSaveHandle',handle);
    render();
    await doAutoSave();
    alert('自動保存先を設定しました！\nデータ変更時に自動で上書き保存されます。');
  }catch(e){if(e.name!=='AbortError')console.warn('自動保存設定エラー:',e.message)}
}

async function clearAutoSave(){
  _autoSaveHandle=null;
  dbDel('meta','_autoSaveHandle');
  render();
}

async function doAutoSave(){
  if(!_autoSaveHandle)return;
  try{
    var perm=await _autoSaveHandle.queryPermission({mode:'readwrite'});
    if(perm==='prompt')perm=await _autoSaveHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){_autoSaveHandle=null;dbDel('meta','_autoSaveHandle');render();return}
    var data={version:2,date:new Date().toISOString(),drawings:DRAWINGS,invoices:INVOICES,masters:MASTERS,nextId:nextId,scannedPdfs:scannedPdfs,pdfThumbnails:pdfThumbnails,scannedImages:scannedImages};
    var writable=await _autoSaveHandle.createWritable();
    await writable.write(JSON.stringify(data));
    await writable.close();
  }catch(e){
    console.warn('自動保存失敗:',e.message);
    if(e.name==='NotAllowedError'){_autoSaveHandle=null;dbDel('meta','_autoSaveHandle');render()}
  }
}

function scheduleAutoSave(){
  if(!_autoSaveHandle)return;
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer=setTimeout(doAutoSave,2000);
}

// 起動時にIndexedDBから自動保存先ハンドルを復元
(function restoreAutoSaveHandle(){
  setTimeout(function(){
    dbGet('meta','_autoSaveHandle',function(h){
      if(h){_autoSaveHandle=h;render()}
    });
  },1000);
})();
try{
  if(typeof firebase!=='undefined'){
    fbApp=firebase.initializeApp(FIREBASE_CONFIG);
    fbDB=firebase.firestore();
    fbEnabled=true;
    console.log('Firebase initialized');
  }
}catch(e){console.log('Firebase init failed:',e.message)}

// --- localStorage persistence ---
// === IndexedDB Storage ===
var DB=null;
var DB_NAME='dxp_db';
var DB_VERSION=1;

function openDB(callback){
  if(DB){callback(DB);return}
  var done=false;
  function fallback(){if(done)return;done=true;callback(null)}
  var req;
  try{
    if(!window.indexedDB){throw new Error('indexedDB unavailable')}
    req=indexedDB.open(DB_NAME,DB_VERSION);
  }catch(e){
    // サンドボックス化されたiframe/プライベートモード等で例外 → localStorage へフォールバック
    console.error('IndexedDB open threw, falling back to localStorage',e);
    fallback();return;
  }
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');
    if(!db.objectStoreNames.contains('images'))db.createObjectStore('images');
  };
  req.onsuccess=function(e){if(done)return;done=true;DB=e.target.result;callback(DB)};
  req.onerror=function(){console.error('IndexedDB failed, falling back to localStorage');fallback()};
  // 別タブが旧バージョンで開いている場合 onblocked で固まるのを防ぐ
  req.onblocked=function(){console.error('IndexedDB open blocked (別タブで開いている可能性), falling back');fallback()};
  // 何のイベントも発火しない環境の保険（5秒で強制フォールバック）
  setTimeout(fallback,5000);
}

function dbPut(store,key,val,cb){
  openDB(function(db){
    if(!db){try{localStorage.setItem(key,typeof val==='string'?val:JSON.stringify(val))}catch(e){}if(cb)cb();return}
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(val,key);
    tx.oncomplete=function(){if(cb)cb()};
    tx.onerror=function(){if(cb)cb()};
  });
}

function dbGet(store,key,cb){
  openDB(function(db){
    if(!db){var v=localStorage.getItem(key);cb(v);return}
    var tx=db.transaction(store,'readonly');
    var req=tx.objectStore(store).get(key);
    req.onsuccess=function(){cb(req.result)};
    req.onerror=function(){cb(null)};
  });
}

function dbDel(store,key,cb){
  openDB(function(db){
    if(!db){localStorage.removeItem(key);if(cb)cb();return}
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=function(){if(cb)cb()};
  });
}

function dbClear(cb){
  openDB(function(db){
    if(!db){
      var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('dxp_')===0)keys.push(k)}
      keys.forEach(function(k){localStorage.removeItem(k)});
      if(cb)cb();return;
    }
    var tx=db.transaction(['meta','images'],'readwrite');
    tx.objectStore('meta').clear();
    tx.objectStore('images').clear();
    tx.oncomplete=function(){if(cb)cb()};
  });
}

function loadData(){
  // Try IndexedDB first, fall back to localStorage migration
  openDB(function(db){
    if(db){
      var tx=db.transaction('meta','readonly');
      var store=tx.objectStore('meta');
      var reqs={};
      ['drawings','invoices','scannedPdfs','pdfThumbs','nextId','masters','serverUrl','inspections','relatedFiles','relatedDocuments','annotations','deliveries','worklogs','trash'].forEach(function(k){
        reqs[k]=store.get(k);
      });
      tx.oncomplete=function(){
        if(reqs.drawings.result){
          DRAWINGS=reqs.drawings.result;
        }else if(!window._cacheLoaded){
          // IndexedDB 空 & dxp_fbCache も未ロード → localStorage 移行か DEFAULT にフォールバック
          var ld=localStorage.getItem('dxp_drawings');
          if(ld)DRAWINGS=JSON.parse(ld);else DRAWINGS=DEFAULT_DRAWINGS.slice();
        }
        // window._cacheLoaded=true の場合は dxp_fbCache が既に DRAWINGS を設定済みなのでそのまま使用
        INVOICES=reqs.invoices.result||[];
        if(reqs.deliveries.result)DELIVERIES=reqs.deliveries.result;
        if(reqs.worklogs.result)WORKLOGS=reqs.worklogs.result;
        if(reqs.trash.result)TRASH=reqs.trash.result;
        scannedPdfs=reqs.scannedPdfs.result||{};
        pdfThumbnails=reqs.pdfThumbs.result||{};
        inspectionReports=reqs.inspections.result||{};
        if(reqs.relatedFiles.result)relatedFiles=reqs.relatedFiles.result;
        if(reqs.relatedDocuments.result)relatedDocuments=reqs.relatedDocuments.result;
        migrateRelatedFilesToDocs();
        deduplicateInspections();
        deduplicateRelatedDocs();
if(reqs.annotations.result)ANNOTATIONS=reqs.annotations.result;
        if(reqs.nextId.result)nextId=reqs.nextId.result;
        if(reqs.masters.result)MASTERS=reqs.masters.result;
        else MASTERS=JSON.parse(JSON.stringify(DEF_MASTERS));
        // Ensure 'その他' status exists
        if(MASTERS.statuses&&MASTERS.statuses.indexOf('その他')<0)MASTERS.statuses.push('その他');if(MASTERS.statuses&&MASTERS.statuses.indexOf('完了')<0){var ni=MASTERS.statuses.indexOf('納品済');if(ni>=0)MASTERS.statuses.splice(ni,0,'完了');else MASTERS.statuses.push('完了');}if(MASTERS.statuses&&MASTERS.statuses.indexOf('待機')<0)MASTERS.statuses.unshift('待機');
        // Render NOW with metadata - don't wait for images
        window._dbLoaded=true;
        render();
        checkUrlAndOpen();
        startFbAfterLoad();
        // Load images from IndexedDB IN BACKGROUND
        var imgTx=db.transaction('images','readonly');
        var imgStore=imgTx.objectStore('images');
        var imgReq=imgStore.getAll();
        var keyReq=imgStore.getAllKeys();
        imgTx.oncomplete=function(){
          scannedImages={};
          if(keyReq.result&&imgReq.result){
            keyReq.result.forEach(function(k,i){
              scannedImages[k]=imgReq.result[i];
            });
          }
          // Migrate from localStorage if IndexedDB images empty
          if(Object.keys(scannedImages).length===0){
            migrateFromLocalStorage();
          }
          render(); // Re-render with images now loaded
        };
      };
    }else{
      loadFromLocalStorage();
      if(MASTERS.statuses&&MASTERS.statuses.indexOf('その他')<0)MASTERS.statuses.push('その他');if(MASTERS.statuses&&MASTERS.statuses.indexOf('完了')<0){var ni=MASTERS.statuses.indexOf('納品済');if(ni>=0)MASTERS.statuses.splice(ni,0,'完了');else MASTERS.statuses.push('完了');}if(MASTERS.statuses&&MASTERS.statuses.indexOf('待機')<0)MASTERS.statuses.unshift('待機');
      window._dbLoaded=true;
      render();
      checkUrlAndOpen();
      startFbAfterLoad();
    }
  });
}

function migrateFromLocalStorage(){
  // Migrate old localStorage data to IndexedDB
  var siKeys=localStorage.getItem('dxp_imgKeys');
  if(siKeys){
    JSON.parse(siKeys).forEach(function(id){
      var img=localStorage.getItem('dxp_img_'+id);
      if(img){scannedImages[id]=img;dbPut('images',String(id),img)}
    });
  }else{
    var si=localStorage.getItem('dxp_scannedImages');
    if(si){
      var parsed=JSON.parse(si);
      Object.keys(parsed).forEach(function(id){
        scannedImages[id]=parsed[id];
        dbPut('images',String(id),parsed[id]);
      });
    }
  }
  var ld=localStorage.getItem('dxp_drawings');
  if(ld&&!DRAWINGS.length)DRAWINGS=JSON.parse(ld);
  var sp=localStorage.getItem('dxp_scannedPdfs');
  if(sp)scannedPdfs=JSON.parse(sp);
  var pt=localStorage.getItem('dxp_pdfThumbs');
  if(pt)pdfThumbnails=JSON.parse(pt);
  var ni=localStorage.getItem('dxp_nextId');
  if(ni)nextId=parseInt(ni);
  var ms=localStorage.getItem('dxp_masters');
  if(ms)MASTERS=JSON.parse(ms);
  // Save to IndexedDB
  saveAll();
}

function loadFromLocalStorage(){
  try{
    var d=localStorage.getItem('dxp_drawings');
    if(d){DRAWINGS=JSON.parse(d)}else{DRAWINGS=DEFAULT_DRAWINGS.slice()}
    var inv=localStorage.getItem('dxp_invoices');
    if(inv)INVOICES=JSON.parse(inv);
    var dlv=localStorage.getItem('dxp_deliveries');
    if(dlv)DELIVERIES=JSON.parse(dlv);
    scannedImages={};
    var siKeys=localStorage.getItem('dxp_imgKeys');
    if(siKeys){JSON.parse(siKeys).forEach(function(id){var img=localStorage.getItem('dxp_img_'+id);if(img)scannedImages[id]=img})}
    var sp=localStorage.getItem('dxp_scannedPdfs');if(sp)scannedPdfs=JSON.parse(sp);
    var pt=localStorage.getItem('dxp_pdfThumbs');if(pt)pdfThumbnails=JSON.parse(pt);
    var ni=localStorage.getItem('dxp_nextId');if(ni)nextId=parseInt(ni);
    var ms=localStorage.getItem('dxp_masters');if(ms)MASTERS=JSON.parse(ms);else MASTERS=JSON.parse(JSON.stringify(DEF_MASTERS));
  }catch(e){DRAWINGS=DEFAULT_DRAWINGS.slice();MASTERS=JSON.parse(JSON.stringify(DEF_MASTERS))}
}

function migrateRelatedFilesToDocs(){
  var changed=false;
  Object.keys(relatedFiles).forEach(function(drawingId){
    (relatedFiles[drawingId]||[]).forEach(function(f){
      if(!relatedDocuments[drawingId])relatedDocuments[drawingId]=[];
      var exists=relatedDocuments[drawingId].find(function(x){return x.name===f.name;});
      if(!exists){
        var fileId=String(drawingId)+'_mig_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        relatedDocuments[drawingId].push({name:f.name,date:f.date,type:f.type,fileId:fileId,data:f.data||''});
        locallyAddedRdocIds[fileId]=true;
        changed=true;
      }
    });
  });
  if(changed){relatedFiles={};dbPut('meta','relatedFiles',relatedFiles);}
}
function saveAll(skipImages){
  // Save metadata to IndexedDB
  dbPut('meta','drawings',DRAWINGS);
  dbPut('meta','invoices',INVOICES);
  dbPut('meta','deliveries',DELIVERIES);
  try{localStorage.setItem('dxp_deliveries',JSON.stringify(DELIVERIES));}catch(e){}
  dbPut('meta','scannedPdfs',scannedPdfs);
  dbPut('meta','pdfThumbs',pdfThumbnails);
  dbPut('meta','nextId',nextId);
  dbPut('meta','masters',MASTERS);
  dbPut('meta','inspections',inspectionReports);
  dbPut('meta','relatedFiles',relatedFiles);
  dbPut('meta','relatedDocuments',relatedDocuments);
  dbPut('meta','annotations',ANNOTATIONS);
  dbPut('meta','worklogs',WORKLOGS);
  dbPut('meta','trash',TRASH);
  // Save images individually
  Object.keys(scannedImages).forEach(function(id){
    dbPut('images',String(id),scannedImages[id]);
  });
  // Firebase sync (debounced)
  if(fbEnabled){
    fbLastLocalChange=Date.now();
    clearTimeout(window._fbSyncTimer);
    window._fbSyncTimer=setTimeout(function(){fbPushAll(!!skipImages);},skipImages?500:1500);
  }
  // 自動JSONバックアップ（保存先が設定されている場合）
  scheduleAutoSave();
}

// Remove duplicate/corrupted inspection entries (empty fileId or same fileId twice)
function deduplicateRelatedDocs(){
  var changed=false;
  Object.keys(relatedDocuments).forEach(function(drawingId){
    var arr=relatedDocuments[drawingId]||[];
    var seenNames={};var seenIds={};
    var deduped=arr.filter(function(r){
      var nk=r.name||'';var ik=r.fileId||'';
      if((nk&&seenNames[nk])||(ik&&seenIds[ik])){changed=true;return false;}
      if(nk)seenNames[nk]=true;if(ik)seenIds[ik]=true;
      return true;
    });
    relatedDocuments[drawingId]=deduped;
    if(deduped.length===0)delete relatedDocuments[drawingId];
  });
  if(changed)dbPut('meta','relatedDocuments',relatedDocuments);
  return changed;
}
function deduplicateInspections(){
  var changed=false;
  Object.keys(inspectionReports).forEach(function(id){
    var orig=(inspectionReports[id]||[]);
    var seen={};
    var filtered=orig.filter(function(r){
      if(!r.fileId)return false;
      if(seen[r.fileId])return false;
      seen[r.fileId]=true;
      return true;
    });
    if(filtered.length!==orig.length){changed=true;}
    if(filtered.length===0)delete inspectionReports[id];
    else inspectionReports[id]=filtered;
  });
  return changed;
}

// ========== Firebase Sync Functions (metadata only, no images) ==========
function inspMeta(){var r={};Object.keys(inspectionReports).forEach(function(id){r[id]=(inspectionReports[id]||[]).map(function(x){return{name:x.name,date:x.date,type:x.type,fileId:x.fileId||'',url:x.url||''};});});return r;}
function relDocMeta(){var r={};Object.keys(relatedDocuments).forEach(function(id){r[id]=(relatedDocuments[id]||[]).map(function(x){return{name:x.name,date:x.date,type:x.type,fileId:x.fileId||'',url:x.url||''};});});return r;}
var fbMetaSyncing=false;
function fbPushAll(skipImages){
  if(!fbEnabled)return;
  // 画像アップロード中でも skipImages=true(メタのみ)は通す。60秒超で fbSyncing 自動リセット。
  if(fbSyncing&&!skipImages){
    if(window._fbSyncingAt&&Date.now()-window._fbSyncingAt>60000){fbSyncing=false;}
    else{clearTimeout(window._fbSyncTimer);window._fbSyncTimer=setTimeout(function(){fbPushAll(skipImages);},1500);return;}
  }
  if(fbMetaSyncing){clearTimeout(window._fbSyncTimer);window._fbSyncTimer=setTimeout(function(){fbPushAll(skipImages);},800);return;}
  // Firebase からの初回 snapshot を受け取る前に push しない
  if(!window._fbSnapshotReceived){
    clearTimeout(window._fbSyncTimer);
    window._fbSyncTimer=setTimeout(function(){fbPushAll(skipImages);},3000);
    return;
  }
  // デモデータ（DEFAULT_DRAWINGS）をそのまま push しない
  if(DRAWINGS.length>0&&DRAWINGS.length===DEFAULT_DRAWINGS.length){
    var isDefault=DRAWINGS.every(function(d,i){return d.id===DEFAULT_DRAWINGS[i].id&&d.number===DEFAULT_DRAWINGS[i].number});
    if(isDefault)return;
  }
  updateSyncStatus('pushing');
  function pushMeta(){
    fbMetaSyncing=true;
    var payload={
      drawings:DRAWINGS,masters:MASTERS,inspections:inspMeta(),relatedDocuments:relDocMeta(),
      invoices:INVOICES,annotations:ANNOTATIONS,deliveries:DELIVERIES,worklogs:WORKLOGS,trash:TRASH,nextId:nextId,
      lastModified:firebase.firestore.FieldValue.serverTimestamp(),
      lastClient:fbClientId()
    };
    fbDB.collection('workspaces').doc('default').set(payload).then(function(){
      fbMetaSyncing=false;
      updateSyncStatus('synced');
    }).catch(function(e){
      fbMetaSyncing=false;
      updateSyncStatus('error',e.message);
      console.error('Firebase push failed:',e);
    });
  }
  if(skipImages){
    // ステータス変更・書き込みなど — 画像アップロードを待たず即送信
    pushMeta();
  }else{
    fbSyncing=true;
    window._fbSyncingAt=Date.now();
    fbPushImages().then(function(){
      fbSyncing=false;
      pushMeta();
    }).catch(function(e){
      fbSyncing=false;
      updateSyncStatus('error',e.message);
      console.error('Firebase image push failed:',e);
    });
  }
}

// Push images to Firestore individually (one doc per drawing image)
// 画像を先にアップロードし、完了後に imgVer を図面に設定する。
// メタデータ push は呼び出し元（fbPushAll）がこの完了を待ってから行う。
async function fbPushImages(){
  if(!fbEnabled)return;
  _imgSyncFailCount=0; // この回のpushでの失敗数（終了時にまとめて通知）
  _imgSyncFailIds=[];
  var allIds=Object.keys(scannedImages).concat(Object.keys(scannedPdfs));
  // Dedupe
  var seen={};
  var ids=[];
  allIds.forEach(function(id){if(!seen[id]){seen[id]=true;ids.push(id)}});

  // Track which images have been synced (avoid re-uploading)
  if(!window._fbSyncedImages)window._fbSyncedImages={};

  var MAX_BYTES=950*1024; // ~950KB raw = ~1.27MB base64. Keep below 1MB Firestore limit.

  for(var i=0;i<ids.length;i++){
    var id=ids[i];
    var img=scannedImages[id];
    var pdf=scannedPdfs[id];
    var thumb=pdfThumbnails[id];
    // pdf が boolean true の場合（単体登録PDFの legacy 形式）は length が undefined になるため String() で正規化
    var pdfLen=pdf&&typeof pdf==='string'?pdf.length:0;
    var version=(img?img.length:0)+'_'+pdfLen+'_'+(thumb?thumb.length:0);
    if(window._fbSyncedImages[id]===version)continue;

    try{
      var doc={updated:Date.now()};

      // Image: compress as needed to fit MAX_BYTES while keeping high quality
      if(img&&typeof img==='string'){
        if(img.length<MAX_BYTES){
          doc.image=img;
        }else{
          // Compress: try high quality first, downscale if needed
          var compressed=await compressImageForSync(img,MAX_BYTES);
          if(compressed)doc.image=compressed;
        }
      }

      // PDF: include if fits (string data URL のみ、boolean flag は除外)
      if(pdf&&typeof pdf==='string'&&pdf.length<MAX_BYTES){
        doc.pdf=pdf;
      }

      // Thumbnail: always include if available (small)
      if(thumb&&typeof thumb==='string'&&thumb.length<MAX_BYTES){
        doc.thumb=thumb;
      }

      // 【重要】個別チェックだけでは image+pdf+thumb の合計が Firestore の1ドキュメント1MB制限
      // (1,048,576バイト)を超えることがあり、その場合 set() が毎回拒否され永久に同期失敗し続ける。
      // 実制限にオーバーヘッド余裕を見た閾値を超える場合のみ、収まるまで段階的に落とす:
      // ①PDFを外す → ②画像を残り容量まで再圧縮 → ③サムネのみ
      var TOTAL_MAX=1020*1024;
      var _total=function(o){return (o.image?o.image.length:0)+(o.pdf?o.pdf.length:0)+(o.thumb?o.thumb.length:0);};
      if(_total(doc)>TOTAL_MAX&&doc.pdf&&(doc.image||doc.thumb)){delete doc.pdf;}
      if(_total(doc)>TOTAL_MAX&&doc.image){
        var _room=TOTAL_MAX-(doc.thumb?doc.thumb.length:0)-(doc.pdf?doc.pdf.length:0);
        var _rec=_room>50*1024?await compressImageForSync(doc.image,_room):null;
        if(_rec)doc.image=_rec;
        else if(doc.thumb)delete doc.image;
      }
      if(_total(doc)>TOTAL_MAX&&doc.thumb){delete doc.image;delete doc.pdf;}

      if(Object.keys(doc).length<=1)continue;

      await fbDB.collection('workspaces').doc('default').collection('images').doc(String(id)).set(doc);
      window._fbSyncedImages[id]=version;
      // 画像アップ完了後に imgVer を更新（メタデータ push 前に設定することで一発で整合性が取れる）
      var dObj=DRAWINGS.find(function(x){return String(x.id)===id});
      if(dObj){
        dObj.imgVer=Date.now();
        // _localImgVer も更新してPC自身がエコーで自分の画像を再取得しないようにする
        _localImgVer[String(id)]=dObj.imgVer;
        try{localStorage.setItem('dxp_localImgVer',JSON.stringify(_localImgVer));}catch(e){}
      }
      if(i%3===2)await new Promise(function(r){setTimeout(r,50)});
    }catch(e){
      console.warn('Image sync failed for id',id,':',e.message);
      _imgSyncFailCount++;
      _imgSyncFailIds.push(id);
    }
  }
  // 失敗があれば通知（_fbSyncedImages未更新のため次回pushで自動再試行される）。
  // ただし同じ画像の失敗を毎回トーストするとうるさいので、このセッションで
  // 初めて失敗した画像がある時だけ表示する（既知の失敗の繰り返しはconsoleのみ）。
  if(_imgSyncFailCount>0){
    if(!window._imgSyncNotifiedIds)window._imgSyncNotifiedIds={};
    var _hasNew=_imgSyncFailIds.some(function(fid){return !window._imgSyncNotifiedIds[fid]});
    _imgSyncFailIds.forEach(function(fid){window._imgSyncNotifiedIds[fid]=1});
    if(_hasNew){
      var fc=_imgSyncFailCount;
      try{toast('⚠ 図面画像 '+fc+'件のクラウド同期に失敗しました（次回保存時に自動再試行）');}catch(e){}
    }
  }
}
var _imgSyncFailCount=0;
var _imgSyncFailIds=[];

// Compress an image dataUrl to fit within target bytes while preserving as much quality as possible
function compressImageForSync(dataUrl,targetBytes){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d');
      var w=img.naturalWidth,hgt=img.naturalHeight;
      // Try several quality/size combos, picking the best that fits
      var attempts=[
        {scale:1.0,quality:0.92},
        {scale:1.0,quality:0.85},
        {scale:0.85,quality:0.88},
        {scale:0.75,quality:0.85},
        {scale:0.65,quality:0.82},
        {scale:0.55,quality:0.80},
        {scale:0.45,quality:0.78},
        {scale:0.35,quality:0.75}
      ];
      function tryAt(idx){
        if(idx>=attempts.length){resolve(null);return}
        var a=attempts[idx];
        canvas.width=Math.round(w*a.scale);
        canvas.height=Math.round(hgt*a.scale);
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        var out=canvas.toDataURL('image/jpeg',a.quality);
        if(out.length<targetBytes){resolve(out)}
        else{tryAt(idx+1)}
      }
      tryAt(0);
    };
    img.onerror=function(){resolve(null)};
    img.src=dataUrl;
  });
}

// メール/FAX自動取込ウォッチャーの死活監視。watcher_health を1回読み、異常があればバナー表示。
function checkWatcherHealth(){
  if(!fbEnabled||window._watcherHealthChecked)return;
  window._watcherHealthChecked=true;
  fbDB.collection('workspaces').doc('watcher_health').get().then(function(doc){
    if(!doc.exists)return;
    var d=doc.data()||{};
    var msgs=[];
    if(d.lastError)msgs.push('前回の実行がエラーで終了: '+d.lastError);
    if(d.lastSuccessAt&&(Date.now()-new Date(d.lastSuccessAt).getTime())>26*3600*1000)msgs.push('26時間以上取込が動いていません（監視PCの電源とOutlookの起動を確認）');
    if(d.faxFolderOk===false)msgs.push('FAX共有フォルダに接続できません');
    if(d.mailFolderOk===false)msgs.push('メール監視フォルダが見つかりません');
    if(d.backupOk===false)msgs.push('日次バックアップに失敗しています（NAS接続を確認）');
    if(typeof d.mainDocSizeKB==='number'&&d.mainDocSizeKB>700)msgs.push('データ量が同期上限に接近しています（'+d.mainDocSizeKB+'KB/1024KB）。古い図面のアーカイブ等の対策が必要です');
    if(!msgs.length)return;
    var el=document.createElement('div');
    el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#B3261E;color:#fff;padding:10px 44px 10px 16px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.3);line-height:1.6';
    el.innerHTML='⚠ メール/FAX自動取込の異常: '+msgs.map(function(m){return esc(m)}).join(' ／ ');
    var btn=document.createElement('button');
    btn.innerHTML='&times;';
    btn.style.cssText='position:absolute;right:8px;top:6px;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1';
    btn.onclick=function(){el.remove()};
    el.appendChild(btn);
    document.body.appendChild(el);
  }).catch(function(e){console.warn('watcher_health check failed:',e.message)});
}
function fbStartListener(){
  if(!fbEnabled)return;
  if(fbUnsubscribe)fbUnsubscribe();
  fbUnsubscribe=fbDB.collection('workspaces').doc('default').onSnapshot(function(doc){
    // ドキュメントが存在しない場合でもフラグをセット（push がブロックされないように）
    window._fbSnapshotReceived=true;
    checkWatcherHealth();
    if(!doc.exists)return;
    var data=doc.data();
    if(!data)return;
    // 自分のエコーのみ抑制（他デバイスの変更は常に適用）
    if(data.lastClient===fbClientId()&&Date.now()-fbLastLocalChange<15000)return;
    // Merge: server data overwrites local
    if(data.drawings){
      DRAWINGS=data.drawings;DRAWINGS.forEach(function(d){if(d.status==='検図中')d.status='検討中';});
      // 直近のローカル ステータス変更を優先: 受信データが古い値なら再適用し、サーバーに押し返す
      var _pnow=Date.now(),_reassert=false;
      Object.keys(pendingStatusEdits).forEach(function(pid){
        var pe=pendingStatusEdits[pid];
        if(pe.until<_pnow){delete pendingStatusEdits[pid];return;}
        var pd=DRAWINGS.find(function(x){return String(x.id)===pid;});
        if(!pd){delete pendingStatusEdits[pid];return;}
        if(pd.status!==pe.status){pd.status=pe.status;if(pe.lastAccess!=null)pd.lastAccess=pe.lastAccess;_reassert=true;}
        else{delete pendingStatusEdits[pid];} // サーバーが追いついたので解除
      });
      if(_reassert){fbLastLocalChange=Date.now();clearTimeout(window._fbSyncTimer);window._fbSyncTimer=setTimeout(function(){fbPushAll(true);},800);}
    }
    if(data.masters){MASTERS=data.masters;if(MASTERS.statuses){var idx=MASTERS.statuses.indexOf('検図中');if(idx>=0)MASTERS.statuses[idx]='検討中';}}
    if(MASTERS.statuses&&MASTERS.statuses.indexOf('完了')<0){var _ni=MASTERS.statuses.indexOf('納品済');if(_ni>=0)MASTERS.statuses.splice(_ni,0,'完了');else MASTERS.statuses.push('完了');}
    if(MASTERS.statuses&&MASTERS.statuses.indexOf('待機')<0)MASTERS.statuses.unshift('待機');
    if(data.inspections){
      var needPushBack=false;
      // Firestoreにある図面のエントリを処理
      Object.keys(data.inspections).forEach(function(id){
        var incoming=data.inspections[id]||[];
        var existing=inspectionReports[id]||[];
        var merged=incoming.map(function(r){
          var local=r.fileId?existing.find(function(x){return x.fileId===r.fileId;}):null;
          return local?local:{name:r.name,date:r.date,type:r.type,fileId:r.fileId||'',data:r.data||''};
        });
        // ローカルにのみある有効エントリ（アップロード直後など未同期）も保持してFirestoreに書き戻す
        existing.forEach(function(e){
          if(e.fileId&&!merged.find(function(m){return m.fileId===e.fileId;})){
            merged.push(e);needPushBack=true;
          }
        });
        inspectionReports[id]=merged;
      });
      // Firestoreにない図面: 有効なfileIdがあれば保持してプッシュ、なければ削除
      Object.keys(inspectionReports).forEach(function(id){
        if(!data.inspections[id]){
          var valid=(inspectionReports[id]||[]).filter(function(r){return !!r.fileId;});
          if(valid.length>0){inspectionReports[id]=valid;needPushBack=true;}
          else delete inspectionReports[id];
        }
      });
      // 重複・破損エントリ除去 + ローカル未同期エントリがあればFirestoreに書き戻す
      var dedupChanged=deduplicateInspections();
      if(dedupChanged||needPushBack){
        fbLastLocalChange=Date.now();
        fbDB.collection('workspaces').doc('default').update({inspections:inspMeta(),lastModified:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.warn('sync push failed:',e.message);try{toast('⚠ 検査報告書の同期に失敗しました（通信状態を確認してください）');}catch(_){}});
      }
      fbLoadInspectionFiles();
    }
    if(data.relatedDocuments){
      var rdNeedPushBack=false;
      Object.keys(data.relatedDocuments).forEach(function(id){
        var incoming=data.relatedDocuments[id]||[];
        var existing=relatedDocuments[id]||[];
        var merged=incoming.map(function(r){
          var local=r.fileId?existing.find(function(x){return x.fileId===r.fileId;}):null;
          return local?local:{name:r.name,date:r.date,type:r.type,fileId:r.fileId||'',data:r.data||''};
        });
        existing.forEach(function(e){
          if(e.fileId&&!merged.find(function(m){return m.fileId===e.fileId;})&&locallyAddedRdocIds[e.fileId]){
            merged.push(e);rdNeedPushBack=true;
          }
        });
        relatedDocuments[id]=merged;
      });
      Object.keys(relatedDocuments).forEach(function(id){
        if(!data.relatedDocuments[id]){
          var valid=(relatedDocuments[id]||[]).filter(function(r){return !!r.fileId&&locallyAddedRdocIds[r.fileId];});
          if(valid.length>0){relatedDocuments[id]=valid;rdNeedPushBack=true;}
          else delete relatedDocuments[id];
        }
      });
      var rdDedupChanged=deduplicateRelatedDocs();
      if(rdNeedPushBack||rdDedupChanged){
        fbLastLocalChange=Date.now();
        fbDB.collection('workspaces').doc('default').update({relatedDocuments:relDocMeta(),lastModified:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.warn('rdoc sync push failed:',e.message);try{toast('⚠ 関連書類の同期に失敗しました（通信状態を確認してください）');}catch(_){}});
      }
      fbLoadRelatedDocFiles();
    }
    if(data.invoices)INVOICES=data.invoices;
    if(data.deliveries)DELIVERIES=data.deliveries;
    if(data.annotations)ANNOTATIONS=data.annotations;
    if(data.worklogs)WORKLOGS=data.worklogs;
    if(data.trash)TRASH=data.trash;
    // 直近のローカル削除を再主張: 受信データ(DRAWINGS/TRASH上書き後)に削除済み案件が復活していたら
    // 再削除してゴミ箱へ戻し、サーバーに押し返す（待機の削除が競合で戻る問題の対策）
    var _delReassert=false,_dnow=Date.now();
    Object.keys(pendingDeletes).forEach(function(pid){
      var pe=pendingDeletes[pid];
      if(!pe||pe.until<_dnow){delete pendingDeletes[pid];return;}
      var idx=-1;for(var _i=0;_i<DRAWINGS.length;_i++){if(String(DRAWINGS[_i].id)===pid){idx=_i;break;}}
      if(idx<0)return; // 復活していない＝削除は効いている
      var cur=DRAWINGS[idx];
      // id再利用で別案件が入っている場合は誤削除しない（図番が一致する時だけ再削除）
      if((cur.number||'')!==(pe.num||''))return;
      DRAWINGS.splice(idx,1);
      if(!TRASH.some(function(t){return t.d&&String(t.d.id)===pid;})){
        TRASH.unshift({d:cur,deletedAt:Date.now(),deletedBy:(typeof AUTH_USER!=='undefined'&&AUTH_USER&&AUTH_USER.email)||''});
      }
      _delReassert=true;
    });
    if(_delReassert){fbLastLocalChange=Date.now();clearTimeout(window._fbSyncTimer);window._fbSyncTimer=setTimeout(function(){fbPushAll(true);},800);}
    if(data.nextId)nextId=Math.max(nextId,data.nextId);
    // 30日経過したゴミ箱エントリの自動完全削除（1セッション1回）
    purgeOldTrash();
    // Save to IndexedDB
    dbPut('meta','drawings',DRAWINGS);
    dbPut('meta','deliveries',DELIVERIES);
    dbPut('meta','masters',MASTERS);
    dbPut('meta','inspections',inspectionReports);
    dbPut('meta','relatedDocuments',relatedDocuments);
    dbPut('meta','invoices',INVOICES);
    dbPut('meta','annotations',ANNOTATIONS);
    dbPut('meta','worklogs',WORKLOGS);
    dbPut('meta','trash',TRASH);
    dbPut('meta','nextId',nextId);
    // Cache in localStorage for next session's instant load
    try{
      localStorage.setItem('dxp_fbCache',JSON.stringify({
        drawings:DRAWINGS,
        masters:MASTERS,
        inspections:inspMeta(),
        relatedDocuments:relDocMeta(),
        invoices:INVOICES,
        annotations:ANNOTATIONS,
        deliveries:DELIVERIES,
        worklogs:WORKLOGS,
        trash:TRASH,
        nextId:nextId
      }));
    }catch(e){/* localStorage may be full */}
    updateSyncStatus('synced');
    render();
    // Pull missing images from Firebase (background)
    fbPullMissingImages();
  },function(err){
    updateSyncStatus('error',err.message);
    console.error('Firebase listener error:',err);
  });
}

// Pull images from Firebase that aren't in local IndexedDB yet, or whose imgVer changed
async function fbPullMissingImages(){
  if(!fbEnabled||!DRAWINGS)return;
  // mobileForcePull 経由の場合は全スキャン済み図面を対象にする（1回限り）
  var forcePull=!!window._forcePullImages;
  window._forcePullImages=false;
  var missingIds=[];
  DRAWINGS.forEach(function(d){
    var id=d.id;
    var localHasImage=scannedImages[id]||scannedPdfs[id];
    // 画像未取得 or imgVer がローカル記録より新しい or 強制再取得フラグ
    var imgVerStale=d.imgVer&&(d.imgVer>(_localImgVer[String(id)]||0));
    if(d.scanned&&(!localHasImage||imgVerStale||forcePull)){
      missingIds.push(String(id));
    }
  });
  if(missingIds.length===0)return;

  for(var i=0;i<missingIds.length;i++){
    var id=missingIds[i];
    try{
      var snap=await fbDB.collection('workspaces').doc('default').collection('images').doc(id).get();
      if(snap.exists){
        var data=snap.data();
        if(data.image){
          scannedImages[id]=data.image;
          dbPut('images',id,data.image);
        }
        if(data.pdf){
          scannedPdfs[id]=data.pdf;
          dbPut('meta','scannedPdfs',scannedPdfs);
        }
        if(data.thumb){
          pdfThumbnails[id]=data.thumb;
          dbPut('meta','pdfThumbs',pdfThumbnails);
        }
        // ローカルの imgVer を更新して次回の不要な再取得を防ぐ
        var dObj=DRAWINGS.find(function(x){return String(x.id)===id});
        if(dObj&&dObj.imgVer){
          _localImgVer[id]=dObj.imgVer;
          try{localStorage.setItem('dxp_localImgVer',JSON.stringify(_localImgVer));}catch(e){}
        }
        // Firebaseから取得した画像を「同期済み」としてマーク → モバイル側が fbPushAll 時に再アップロードしないようにする
        if(!window._fbSyncedImages)window._fbSyncedImages={};
        var fetchedImg=scannedImages[id];
        var fetchedPdf=scannedPdfs[id];
        var fetchedThumb=pdfThumbnails[id];
        var fetchedPdfLen=fetchedPdf&&typeof fetchedPdf==='string'?fetchedPdf.length:0;
        window._fbSyncedImages[id]=(fetchedImg?fetchedImg.length:0)+'_'+fetchedPdfLen+'_'+(fetchedThumb?fetchedThumb.length:0);
      }
    }catch(e){console.warn('Pull failed for',id,':',e.message)}
    if(i%3===2)await new Promise(function(r){setTimeout(r,50)});
  }
  // Re-render to show newly loaded images
  render();
}

function fbClientId(){

  }
  return window._fbClientId;
}

function renderPdfThumbnail(id,dataUrl,callback){
  if(typeof pdfjsLib==='undefined'){if(callback)callback(null);return}
  try{
    var raw=atob(dataUrl.split(',')[1]);
    var arr=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
      return pdf.getPage(1);
    }).then(function(page){
      var vp=page.getViewport({scale:1});
      var scale=400/vp.width; // render at 400px wide
      var sv=page.getViewport({scale:scale});
      var cv=document.createElement('canvas');
      cv.width=sv.width;cv.height=sv.height;
      var ctx=cv.getContext('2d');
      return page.render({canvasContext:ctx,viewport:sv}).promise.then(function(){
        var thumbUrl=cv.toDataURL('image/png',0.8);
        if(callback)callback(thumbUrl);
      });
    }).catch(function(){if(callback)callback(null)});
  }catch(e){if(callback)callback(null)}
}

var annoCtx=null,drawing=false;
function initCV(){setTimeout(function(){var c=document.getElementById('cv');if(!c)return;
  var wrap=document.getElementById('annoWrap');if(!wrap)return;
  var d=S.annoDrawing;
  var pdfSrc=d&&getPdfSrc(d.id);
  var isPdf=!!pdfSrc;
  var hasImage=d&&(pdfThumbnails[d.id]||(scannedImages[d.id]&&!isPdf));

  // If PDF, always render via pdf.js for multi-page support
  if(isPdf){
    renderPdfToCanvas(pdfSrc,function(){setupAnnoCanvas()});
  }else{
    setupAnnoCanvas();
  }

  function setupAnnoCanvas(){
    var pdfBg=document.getElementById('pdfBg');
    var bgImg=wrap.querySelector('img[data-scanimg]');
    var displayW=wrap.clientWidth;
    var displayH;
    if(pdfBg&&pdfBg.height>0){
      // Match PDF canvas display size
      displayW=parseInt(pdfBg.style.width)||wrap.clientWidth;
      displayH=parseInt(pdfBg.style.height)||Math.round(displayW*0.707);
      // Position cv over pdfBg
      c.style.top=pdfBg.offsetTop+'px';
    }else if(bgImg&&bgImg.naturalHeight>0){
      // Match actual image aspect ratio
      var imgRatio=bgImg.naturalHeight/bgImg.naturalWidth;
      displayH=Math.round(displayW*imgRatio);
    }else{
      displayH=Math.max(wrap.clientHeight,Math.round(displayW*0.707));
    }
    var DPR=3;
    var w=displayW*DPR, h=displayH*DPR;
    c.width=w;c.height=h;
    c.style.width=displayW+'px';c.style.height=displayH+'px';c.style.touchAction='none';
    var scale=displayW/700; // for stamp/QR positioning at display coords
    var hiScale=scale*DPR; // for drawing at hi-res coords
    annoCtx=c.getContext('2d');

    if(!hasImage&&!isPdf){
      annoCtx.fillStyle='#fff';annoCtx.fillRect(0,0,w,h);
      annoCtx.strokeStyle='#ccc';annoCtx.lineWidth=DPR;
      annoCtx.strokeRect(20*hiScale,15*hiScale,(w-40*hiScale),(h-30*hiScale));
      var tbx=w-230*hiScale,tby=h-80*hiScale;
      annoCtx.strokeRect(tbx,tby,210*hiScale,65*hiScale);
      annoCtx.font=Math.round(11*hiScale)+'px sans-serif';annoCtx.fillStyle='#666';
      if(d){
        annoCtx.fillText('図番:'+d.number,tbx+10*hiScale,tby+18*hiScale);
        annoCtx.fillText('品名:'+d.name,tbx+10*hiScale,tby+34*hiScale);
        annoCtx.fillText('材質:'+d.mat,tbx+10*hiScale,tby+50*hiScale);
        annoCtx.strokeStyle='#444';annoCtx.lineWidth=2*DPR;
        if(d.shape==='circle'){annoCtx.beginPath();annoCtx.arc(w*.4,h*.42,60*hiScale,0,Math.PI*2);annoCtx.stroke()}
        else if(d.shape==='shaft'){annoCtx.strokeRect(w*.2,h*.38,w*.5,40*hiScale)}
        else if(d.shape==='bracket'){annoCtx.beginPath();annoCtx.moveTo(w*.26,h*.22);annoCtx.lineTo(w*.26,h*.72);annoCtx.lineTo(w*.55,h*.72);annoCtx.stroke()}
        else{annoCtx.strokeRect(w*.22,h*.26,w*.42,h*.42)}
      }
    }

    // Store DPR on canvas for use by save/print
    c._dpr=DPR;

    S.annoStamps.forEach(function(s){drawStamp(s.x*hiScale,s.y*hiScale,s.type,hiScale)});
    S.annoTexts.forEach(function(t){drawAnnoText(t.x*hiScale,t.y*hiScale,t.text,t.color,DPR)});
    // Draw saved pen lines
    if(S.annoLines)S.annoLines.forEach(function(line){
      if(!line.points||line.points.length<2)return;
      annoCtx.beginPath();
      annoCtx.strokeStyle=line.color||'#C03030';
      annoCtx.lineWidth=2*DPR;
      annoCtx.lineCap='round';
      annoCtx.lineJoin='round';
      annoCtx.moveTo(line.points[0].x*hiScale,line.points[0].y*hiScale);
      for(var i=1;i<line.points.length;i++){
        annoCtx.lineTo(line.points[i].x*hiScale,line.points[i].y*hiScale);
      }
      annoCtx.stroke();
    });

    function getPos(e){
      var r=c.getBoundingClientRect();var touch=e.touches?e.touches[0]:e;
      var x=(touch.clientX-r.left)*DPR;
      var y=(touch.clientY-r.top)*DPR;
      return{x:x,y:y};
    }
    var currentLine=null;
    function onDown(e){
      e.preventDefault();var p=getPos(e);
      if(S.annoTool==='pen'){
        drawing=true;annoCtx.beginPath();annoCtx.moveTo(p.x,p.y);annoCtx.strokeStyle=S.annoColor;annoCtx.lineWidth=2*DPR;
        currentLine={color:S.annoColor,points:[{x:p.x/hiScale,y:p.y/hiScale}]};
      }
      else if(S.annoTool==='eraser'){
        // Eraser: find and remove nearest annotation
        var clickX=p.x/hiScale,clickY=p.y/hiScale;
        var threshold=20;
        // Try lines first (check any point of line is near)
        var removed=false;
        for(var li=S.annoLines.length-1;li>=0;li--){
          var ln=S.annoLines[li];
          for(var pi=0;pi<ln.points.length;pi++){
            if(Math.abs(ln.points[pi].x-clickX)<threshold&&Math.abs(ln.points[pi].y-clickY)<threshold){
              S.annoLines.splice(li,1);removed=true;break;
            }
          }
          if(removed)break;
        }
        if(!removed){
          for(var i=S.annoStamps.length-1;i>=0;i--){
            if(Math.abs(S.annoStamps[i].x-clickX)<threshold&&Math.abs(S.annoStamps[i].y-clickY)<threshold){S.annoStamps.splice(i,1);removed=true;break}
          }
        }
        if(!removed){
          for(var i=S.annoTexts.length-1;i>=0;i--){
            if(Math.abs(S.annoTexts[i].x-clickX)<threshold&&Math.abs(S.annoTexts[i].y-clickY)<threshold){S.annoTexts.splice(i,1);removed=true;break}
          }
        }
        if(removed){saveCurrentAnnotations();initCV()}
      }
      else if(S.annoTool==='text'){
        var txt=prompt('テキストを入力:');
        if(txt&&txt.trim()){
          drawAnnoText(p.x,p.y,txt.trim(),S.annoColor,DPR);
          S.annoTexts.push({x:p.x/hiScale,y:p.y/hiScale,text:txt.trim(),color:S.annoColor});
          saveCurrentAnnotations();
        }
      }
      else if(S.annoTool.startsWith('stamp-')){drawStamp(p.x,p.y,S.annoTool,DPR);S.annoStamps.push({x:p.x/hiScale,y:p.y/hiScale,type:S.annoTool});saveCurrentAnnotations()}
    }
    function onMove(e){
      if(!drawing)return;e.preventDefault();var p=getPos(e);
      annoCtx.lineTo(p.x,p.y);annoCtx.stroke();
      if(currentLine)currentLine.points.push({x:p.x/hiScale,y:p.y/hiScale});
    }
    function onUp(){
      if(drawing&&currentLine&&currentLine.points.length>1){
        S.annoLines.push(currentLine);
        saveCurrentAnnotations();
      }
      drawing=false;currentLine=null;
    }
    c.onmousedown=onDown;c.onmousemove=onMove;c.onmouseup=onUp;c.onmouseleave=onUp;
    c.ontouchstart=onDown;c.ontouchmove=onMove;c.ontouchend=onUp;c.ontouchcancel=onUp;
  }
},100)}

var annoPdfDoc=null; // cached PDF document for multi-page

function renderPdfToCanvas(dataUrl,callback){
  var pdfBg=document.getElementById('pdfBg');
  if(!pdfBg){if(callback)callback();return}
  if(typeof pdfjsLib==='undefined'){
    pdfBg.width=700;pdfBg.height=400;
    var ctx=pdfBg.getContext('2d');
    ctx.fillStyle='#f8f8f6';ctx.fillRect(0,0,700,400);
    ctx.fillStyle='#888';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText('PDF表示（pdf.jsライブラリ読込中）',350,200);
    if(callback)callback();return;
  }
  var raw=atob(dataUrl.split(',')[1]);
  var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
    annoPdfDoc=pdf;
    S.annoPageCount=pdf.numPages;
    if(S.annoPage>pdf.numPages)S.annoPage=1;
    // Update page counter
    var totalEl=document.getElementById('annoPageTotal');
    if(totalEl)totalEl.textContent=pdf.numPages;
    var numEl=document.getElementById('annoPageNum');
    if(numEl)numEl.innerHTML=S.annoPage+' / '+pdf.numPages;
    // Render current page
    return renderPdfPage(pdf,S.annoPage,pdfBg);
  }).then(function(){
    if(callback)callback();
    renderPdfPagesStrip();
  }).catch(function(e){
    pdfBg.width=700;pdfBg.height=400;
    var ctx=pdfBg.getContext('2d');
    ctx.fillStyle='#f8f8f6';ctx.fillRect(0,0,700,400);
    ctx.fillStyle='#888';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('PDF描画エラー: '+e.message,350,200);
    if(callback)callback();
  });
}

function renderPdfPage(pdf,pageNum,canvas){
  return pdf.getPage(pageNum).then(function(page){
    var vp=page.getViewport({scale:1});
    var wrap=document.getElementById('annoWrap');
    var targetW=wrap?wrap.clientWidth:700;
    var pdfScale=Math.max(2,targetW/vp.width*2);
    var sv=page.getViewport({scale:pdfScale});
    canvas.width=sv.width;canvas.height=sv.height;
    canvas.style.width=Math.round(sv.width/2)+'px';canvas.style.height=Math.round(sv.height/2)+'px';
    var ctx=canvas.getContext('2d');
    return page.render({canvasContext:ctx,viewport:sv}).promise;
  });
}

function renderPdfPagesStrip(){
  var strip=document.getElementById('pdfPagesStrip');
  if(!strip||!annoPdfDoc)return;
  strip.innerHTML='';
  var pdf=annoPdfDoc;
  for(var p=1;p<=pdf.numPages;p++){
    (function(pageNum){
      var cv=document.createElement('canvas');
      cv.style.cssText='height:100px;border-radius:6px;border:2px solid '+(pageNum===S.annoPage?'var(--ac)':'var(--bd)')+';cursor:pointer;flex-shrink:0';
      cv.title='ページ '+pageNum;
      cv.onclick=function(){annoSetPage(pageNum)};
      strip.appendChild(cv);
      pdf.getPage(pageNum).then(function(page){
        var vp=page.getViewport({scale:1});
        var scale=100/vp.height;
        var sv=page.getViewport({scale:scale});
        cv.width=sv.width;cv.height=sv.height;
        cv.style.width=Math.round(sv.width)+'px';
        page.render({canvasContext:cv.getContext('2d'),viewport:sv});
      });
    })(p);
  }
}

function annoSetPage(page){
  if(!annoPdfDoc)return;
  if(page<1)page=1;
  if(page>annoPdfDoc.numPages)page=annoPdfDoc.numPages;
  S.annoPage=page;
  S.annoStamps=[];S.annoQRs=[]; // Clear annotations when changing page
  var pdfBg=document.getElementById('pdfBg');
  if(pdfBg){
    renderPdfPage(annoPdfDoc,page,pdfBg).then(function(){
      // Update page number display
      var numEl=document.getElementById('annoPageNum');
      if(numEl)numEl.innerHTML=page+' / '+annoPdfDoc.numPages;
      // Reinit annotation canvas
      initCV();
      // Update strip highlights
      var strip=document.getElementById('pdfPagesStrip');
      if(strip){
        var items=strip.children;
        for(var i=0;i<items.length;i++){
          items[i].style.borderColor=(i+1===page)?'var(--ac)':'var(--bd)';
        }
      }
    });
  }
}
function drawStamp(x,y,t,sc){sc=sc||1;if(!annoCtx)return;var lb={'stamp-ok':'承認','stamp-ng':'差戻','stamp-check':'検査済','stamp-quote':'見積依頼'},cl={'stamp-ok':'#1B8C65','stamp-ng':'#C03030','stamp-check':'#185FA5','stamp-quote':'#B06E15'};var r=22*sc;annoCtx.save();annoCtx.strokeStyle=cl[t];annoCtx.lineWidth=2;if(t==='stamp-quote'){var w=48*sc,h2=24*sc;annoCtx.strokeRect(x-w/2,y-h2/2,w,h2);annoCtx.font='bold '+Math.round(10*sc)+'px sans-serif';annoCtx.fillStyle=cl[t];annoCtx.textAlign='center';annoCtx.textBaseline='middle';annoCtx.fillText(lb[t],x,y)}else{annoCtx.beginPath();annoCtx.arc(x,y,r,0,Math.PI*2);annoCtx.stroke();annoCtx.font='bold '+Math.round(11*sc)+'px sans-serif';annoCtx.fillStyle=cl[t];annoCtx.textAlign='center';annoCtx.textBaseline='middle';annoCtx.fillText(lb[t],x,y)}annoCtx.restore()}

function drawAnnoText(x,y,text,color,sc){
  sc=sc||1;if(!annoCtx)return;
  annoCtx.save();
  annoCtx.font='bold '+Math.round(14*sc)+'px sans-serif';
  annoCtx.fillStyle=color||'#C03030';
  annoCtx.textAlign='left';
  annoCtx.textBaseline='top';
  // Background for readability
  var metrics=annoCtx.measureText(text);
  var tw=metrics.width;
  var th=Math.round(16*sc);
  annoCtx.fillStyle='rgba(255,255,255,0.85)';
  annoCtx.fillRect(x-2*sc,y-2*sc,tw+4*sc,th+4*sc);
  annoCtx.fillStyle=color||'#C03030';
  annoCtx.fillText(text,x,y);
  annoCtx.restore();
}

function analyticsHTML(){

  var wlByDrawing=wlAggByDrawing();

  var h='<div class="section-title">生産性分析 — 時間あたり付加価値（¥/h）</div>';
  h+='<div style="margin-bottom:14px;font-size:12px;color:var(--tx3);line-height:1.7">単価 ÷ 製造時間で「時間あたりいくら稼げているか」を算出し、低い図面・取引先＝<b style="color:var(--rd)">改善投資のリターンが最大</b>の箇所をあぶり出します。図面編集画面の「製造時間（分/個）」を入力すると集計されます。作業日報で記録した実績（作業時間・良品数・不良数）は図面IDで突き合わせ、実績ベースの値として合わせて表示します。</div>';
  h+='<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><label style="font-size:12px;color:var(--tx2);font-weight:600">目標チャージレート</label><input type="number" value="'+target+'" onwheel="this.blur()" onchange="setTargetRate(this.value)" style="width:110px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px"><span style="font-size:12px;color:var(--tx3)">円/時 未満を<b style="color:var(--rd)">赤字リスク</b>として表示</span></div>';
  if(!withT.length){
    h+='<div style="background:var(--bg2);border:1px dashed var(--bd);border-radius:var(--r);padding:32px 22px;text-align:center;color:var(--tx3);font-size:13px">製造時間が入力された図面がまだありません。<br>図面一覧や案件ボードから図面を開き、<b>編集</b>画面の「製造時間（分/個）」を入力すると、ここに分析が表示されます。</div>';
  }else{

  var rates=rows.map(function(r){return r.rate;});

function wlAggByDrawing(){
  var m={};
  WORKLOGS.forEach(function(w){
    if(w.status!=='完了'||!w.drawingId)return;
    var a=m[w.drawingId];if(!a)a=m[w.drawingId]={minutes:0,good:0,ng:0,n:0};
    a.minutes+=w.minutes||0;a.good+=w.goodQty||0;a.ng+=w.ngQty||0;a.n++;
  });
  return m;
}
// 完了記録を作業者/機械番号で集計。valueYenは紐付いた図面の単価×良品数の合計（実績¥/hの算出に使用）
function wlAggByField(field){
  var m={};
  WORKLOGS.forEach(function(w){
    if(w.status!=='完了')return;
    var k=w[field];if(!k)return;
    var a=m[k];if(!a)a=m[k]={minutes:0,good:0,ng:0,n:0,valueYen:0};
    a.minutes+=w.minutes||0;a.good+=w.goodQty||0;a.ng+=w.ngQty||0;a.n++;
    if(w.drawingId){
      var d=DRAWINGS.find(function(x){return x.id===w.drawingId});
      if(d&&d.price)a.valueYen+=d.price*(w.goodQty||0);
    }
  });
  return m;
}

function scatterSVG(rows,target){
  var W=720,H=380,pl=64,pr=20,pt=20,pb=48,pw=W-pl-pr,ph=H-pt-pb;
  var xMax=rows.reduce(function(m,r){return Math.max(m,r.d.mfgMin);},1)*1.1;
  var yMax=rows.reduce(function(m,r){return Math.max(m,r.d.price);},1)*1.1;
  var X=function(v){return pl+v/xMax*pw;};
  var Y=function(v){return pt+ph-v/yMax*ph;};
  var s='<div style="background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px 10px;box-shadow:var(--shadow);overflow-x:auto"><div style="font-size:13px;font-weight:600;padding:0 8px 8px;color:var(--tx2)">散布図：製造時間 × 単価 <span style="font-size:11px;color:var(--tx3);font-weight:400">（点線より下＝目標¥/h未満。右下ほど「時間がかかる割に安い」＝改善ターゲット）</span></div>';
  s+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:560px;height:auto;font-family:inherit">';
  // 軸
  s+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ph)+'" stroke="var(--bd)" stroke-width="1"/>';
  s+='<line x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(pl+pw)+'" y2="'+(pt+ph)+'" stroke="var(--bd)" stroke-width="1"/>';
  // グリッド＋目盛
  for(var g=1;g<=4;g++){var gx=pl+pw*g/4,gy=pt+ph-ph*g/4;s+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(pl+pw)+'" y2="'+gy+'" stroke="var(--bd)" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>';s+='<text x="'+(pl-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="var(--tx3)">¥'+Math.round(yMax*g/4).toLocaleString()+'</text>';s+='<text x="'+gx+'" y="'+(pt+ph+14)+'" text-anchor="middle" font-size="9" fill="var(--tx3)">'+Math.round(xMax*g/4)+'分</text>';}
  // 目標レート線 price=target*mfg/60
  var lx2=xMax,ly2=target*xMax/60;if(ly2>yMax){ly2=yMax;lx2=yMax*60/target;}
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(lx2)+'" y2="'+Y(ly2)+'" stroke="var(--rd)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>';
  // 点
  rows.forEach(function(r){var bad=r.rate<target;var col=bad?'var(--rd)':'var(--ac)';s+='<circle cx="'+X(r.d.mfgMin).toFixed(1)+'" cy="'+Y(r.d.price).toFixed(1)+'" r="5" fill="'+col+'" opacity="0.7"><title>'+esc(r.d.number)+' '+esc(r.d.name)+'\n単価 ¥'+r.d.price.toLocaleString()+' / '+r.d.mfgMin+'分 = ¥'+Math.round(r.rate).toLocaleString()+'/h</title></circle>';});
  // 軸ラベル
  s+='<text x="'+(pl+pw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--tx3)">製造時間（分/個）</text>';
  s+='<text x="14" y="'+(pt+ph/2)+'" text-anchor="middle" font-size="10" fill="var(--tx3)" transform="rotate(-90 14 '+(pt+ph/2)+')">単価（円）</text>';
  s+='</svg></div>';
  return s;
}

function calcSimilarity(src,tgt){
  var score=0,max=0,reasons=[];

  // 1. 形状一致 (25点)
  max+=25;
  if(src.shape===tgt.shape){score+=25;reasons.push('形状一致')}
  else{
    var shapeSim=SIM[src.shape]&&SIM[src.shape][tgt.shape]?SIM[src.shape][tgt.shape]:0;
    var pts=Math.round(shapeSim*25/100);
    if(pts>5){score+=pts;reasons.push('形状類似')}
  }

  // 2. カテゴリ一致 (15点)
  max+=15;
  if(src.cat===tgt.cat){score+=15;reasons.push('カテゴリ一致')}

  // 3. 材質一致/類似 (20点)
  max+=20;
  if(src.mat===tgt.mat){score+=20;reasons.push('材質一致')}
  else{
    // 材質グループ類似
    var matGroups=[['SUS304','SUS316','SUS420','SUS303'],['SS400','S45C','S50C','S55C'],['SCM435','SCM440','SNCM439'],['A5052','A2017','A6061','A7075'],['FC250','FC200','FC300','FCD450','FCD600'],['SKD11','SKD61','SKH51','SK3']];
    var sg=-1,tg=-1;
    for(var gi=0;gi<matGroups.length;gi++){
      if(matGroups[gi].indexOf(src.mat)>=0)sg=gi;
      if(matGroups[gi].indexOf(tgt.mat)>=0)tg=gi;
    }
    if(sg>=0&&sg===tg){score+=14;reasons.push('材質グループ類似')}
    else if(src.mat.substring(0,2)===tgt.mat.substring(0,2)){score+=8;reasons.push('材質系統類似')}
  }

  // 4. サイズ類似 (20点)
  max+=20;
  var srcNums=extractNums(src.size),tgtNums=extractNums(tgt.size);
  if(srcNums.length>0&&tgtNums.length>0){
    // メイン寸法の比率で類似度
    var ratio=Math.min(srcNums[0],tgtNums[0])/Math.max(srcNums[0],tgtNums[0]);
    if(ratio>0.95){score+=20;reasons.push('サイズほぼ同一')}
    else if(ratio>0.8){score+=15;reasons.push('サイズ近似')}
    else if(ratio>0.5){score+=8;reasons.push('サイズ類似')}
  }else if(src.size===tgt.size&&src.size!=='未指定'){
    score+=20;reasons.push('サイズ一致');
  }

  // 5. 取引先一致 (10点)
  max+=10;
  if(src.client===tgt.client&&src.client!=='未指定'){score+=10;reasons.push('同一取引先')}

  // 6. タグ共通 (10点)
  max+=10;
  if(src.tags&&tgt.tags){
    var common=src.tags.filter(function(t){return tgt.tags.indexOf(t)>=0});
    if(common.length>0){
      var tagScore=Math.min(10,Math.round(common.length/Math.max(src.tags.length,1)*10));
      score+=tagScore;
      if(common.length>=2)reasons.push('タグ'+common.length+'件共通');
      else reasons.push(common[0]+'共通');
    }
  }

  return{score:Math.round(score/max*100),reasons:reasons};
}

function extractNums(s){
  if(!s)return[];
  var m=s.match(/\d+\.?\d*/g);
  return m?m.map(Number).sort(function(a,b){return b-a}):[];
}

// ===== 類似実績検索（見積もり自動化 第二段） =====
// 図面DX(drawings[]) + Firestore yayoiRecords（弥生元帳、estimate-helper/bin/import-to-firestore.js で
// 投入した読み取り専用コレクション）を横断して、径・材質・得意先が近い過去実績から単価目安を出す。
// スコアリングロジックは estimate-helper/lib/similarity.js と同じ考え方を移植したもの。

var JISSEKI_MATERIAL_PATTERNS=['SUS\\d{3}[A-Z]{0,3}','SS\\d{3}','S[0-9]{2}C','SCM\\d{3}','SNCM\\d{3}','A\\d{4}[A-Z]?','FC\\d{2,3}','FCD\\d{2,3}','SK[A-Z]?\\d{1,2}','SKD\\d{1,2}','SKH\\d{1,2}','SUJ\\d','C\\d{4}','SPHC','SPCC','SECC','SGCC'];
var JISSEKI_MATERIAL_RE=new RegExp('('+JISSEKI_MATERIAL_PATTERNS.join('|')+')','i');
var JISSEKI_MAT_GROUPS=[['SUS304','SUS316','SUS420','SUS303'],['SS400','S45C','S50C','S55C'],['SCM435','SCM440','SNCM439'],['A5052','A2017','A6061','A7075'],['FC250','FC200','FC300','FCD450','FCD600'],['SKD11','SKD61','SKH51','SK3']];

function extractMaterialCode(text){if(!text)return '';var m=String(text).match(JISSEKI_MATERIAL_RE);return m?m[1].toUpperCase():'';}
function extractDiameterMmFromText(text){if(!text)return null;var m=String(text).match(/[φΦ]\s?(\d+\.?\d*)/);return m?Number(m[1]):null;}
function jissekiNormalizeMat(s){return String(s||'').normalize('NFKC').toUpperCase().trim();}
function jissekiMatGroupIndex(mat){if(!mat)return -1;for(var i=0;i<JISSEKI_MAT_GROUPS.length;i++){if(JISSEKI_MAT_GROUPS[i].indexOf(mat)>=0)return i;}return -1;}

function jissekiDiameterScore(q,r,tol){
  if(q==null||r==null)return null;
  var ratio=Math.min(q,r)/Math.max(q,r);
  if(ratio>=1-tol*0.25)return 1;
  if(ratio>=1-tol)return 0.75;
  if(ratio>=1-tol*2)return 0.35;
  return 0;
}
function jissekiRepresentativeSize(rec){
  if(rec.diameterMm!=null)return rec.diameterMm;
  var nums=extractNums(rec.sizeRaw||rec.name);
  return nums.length?nums[0]:null;
}
function jissekiMaterialScore(qMat,rec){
  if(!qMat)return null;
  var q=jissekiNormalizeMat(qMat);
  var rMat=jissekiNormalizeMat(rec.material);
  if(rMat){
    if(q===rMat)return 1;
    var qg=jissekiMatGroupIndex(q),rg=jissekiMatGroupIndex(rMat);
    if(qg>=0&&qg===rg)return 0.7;
    if(q.slice(0,2)===rMat.slice(0,2))return 0.4;
  }
  var rText=jissekiNormalizeMat(rec.sizeRaw||rec.name);
  if(rText&&q.length>=2&&rText.indexOf(q)>=0)return 0.8;
  return rMat?0:(rText?0:null);
}
function jissekiNormalizeClient(s){return String(s||'').replace(/[\s　]/g,'').replace(/株式会社|（株）|\(株\)|㈱|有限会社|（有）|\(有\)|㈲/g,'');}
function jissekiClientScore(qClient,rClient){
  if(!qClient)return null;
  var q=qClient.trim(),r=(rClient||'').trim();
  if(!r)return 0;
  if(q===r)return 1;
  var qn=jissekiNormalizeClient(q),rn=jissekiNormalizeClient(r);
  if(qn&&rn&&qn===rn)return 1;
  if(qn&&rn&&qn.length>=2&&(rn.indexOf(qn)>=0||qn.indexOf(rn)>=0))return 0.85;
  return 0;
}
function calcJissekiScore(query,rec,toleranceRatio){
  var W={diameter:40,material:35,client:25};
  var parts=[],reasons=[];
  var dScore=null;
  if(query.diameterMm!=null){
    dScore=jissekiDiameterScore(query.diameterMm,jissekiRepresentativeSize(rec),toleranceRatio);
  }else if(query.sizeRaw){
    var qn=extractNums(query.sizeRaw),rn=extractNums(rec.sizeRaw||rec.name);
    if(qn.length&&rn.length)dScore=jissekiDiameterScore(qn[0],rn[0],toleranceRatio);
  }
  if(dScore!=null){parts.push({w:W.diameter,v:dScore});if(dScore>=1)reasons.push('径ほぼ一致');else if(dScore>=0.75)reasons.push('径が近い(±'+Math.round(toleranceRatio*100)+'%以内)');else if(dScore>0)reasons.push('径がやや近い');}
  var mScore=jissekiMaterialScore(query.material,rec);
  if(mScore!=null){parts.push({w:W.material,v:mScore});if(mScore>=1)reasons.push('材質一致');else if(mScore>=0.8)reasons.push('摘要に材質名あり');else if(mScore>=0.7)reasons.push('材質グループ類似');else if(mScore>0)reasons.push('材質系統類似');}
  var cScore=jissekiClientScore(query.client,rec.client);
  if(cScore!=null){parts.push({w:W.client,v:cScore});if(cScore>=1)reasons.push('得意先一致');}
  if(!parts.length)return{score:0,reasons:[]};
  var maxTotal=parts.reduce(function(s,p){return s+p.w},0);
  var total=parts.reduce(function(s,p){return s+p.w*p.v},0);
  return{score:Math.round(total/maxTotal*100),reasons:reasons};
}
function jissekiPriceStats(results){
  var prices=results.map(function(r){return r.unitPrice}).filter(function(p){return p!=null&&isFinite(p)&&p>0});
  if(!prices.length)return null;
  var sorted=prices.slice().sort(function(a,b){return a-b});
  var sum=sorted.reduce(function(a,b){return a+b},0);
  var mid=Math.floor(sorted.length/2);
  var median=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
  return{count:sorted.length,min:sorted[0],max:sorted[sorted.length-1],avg:sum/sorted.length,median:median};
}

// Firestore yayoiRecords を読み取り専用で検索する（書き込みは一切行わない）。
//
// 2026-07-25修正: 当初は対象径から見て上下両方向へ範囲クエリ(各limit150)を投げてマージする設計
// だったが、実データで「同一径ちょうどのレコードがlimit件数を超える」ケース（φ60が241件等、
// 業種柄よくある）で、範囲クエリの暗黙の副次ソート(ドキュメントID昇順/降順)がID内に埋め込んだ日付を
// そのままなぞってしまい、片方向の150件が特定の年代（例: 古い方だけ）で埋まり切ってしまい、
// 残り（例: 2011年以降のφ60ちょうどのレコード）が一切取得されない不具合があった
// （及川鉄工のφ60 ALHで2012年以降の実績が出てこないバグとして報告・特定）。
// 対策として「径がちょうど一致」を専用クエリで別途まとめて取得し（等価条件のみなので
// 複合インデックス不要、日付に関係なく丸ごと取れる）、それとは別に「近いが一致はしない」範囲を
// 少なめのlimitで上下から補う3クエリ構成にした。
async function fetchYayoiCandidates(query,toleranceRatio){
  if(!fbDB)return[];
  var col=fbDB.collection('yayoiRecords');
  var matRecognized=query.material&&JISSEKI_MATERIAL_RE.test(jissekiNormalizeMat(query.material))?jissekiNormalizeMat(query.material):null;
  var out=[],seen={};
  function pushSnap(snap){snap.forEach(function(doc){if(seen[doc.id])return;seen[doc.id]=true;var v=doc.data();v.source=v.source||'yayoi';v._id=doc.id;out.push(v);});}

  if(query.diameterMm!=null){
    var thr=1-2*toleranceRatio;
    var lo=query.diameterMm*thr,hi=query.diameterMm/thr;
    var base=matRecognized?col.where('material','==',matRecognized):col;
    var qExact=base.where('diameterMm','==',query.diameterMm).limit(300);
    var qUp=base.where('diameterMm','>',query.diameterMm).where('diameterMm','<=',hi).orderBy('diameterMm','asc').limit(75);
    var qDown=base.where('diameterMm','>=',lo).where('diameterMm','<',query.diameterMm).orderBy('diameterMm','desc').limit(75);
    var res=await Promise.all([qExact.get(),qUp.get(),qDown.get()]);
    pushSnap(res[0]);pushSnap(res[1]);pushSnap(res[2]);
  }else if(matRecognized){
    pushSnap(await col.where('material','==',matRecognized).limit(300).get());
  }else if(query.client){
    pushSnap(await col.where('client','==',query.client).limit(300).get());
  }
  return out;
}

// 図面DX側(drawings[])を弥生側と同じレコード形式に正規化する（Firestoreへの新規読み書きは発生しない、
// 既にブラウザに読み込み済みのDRAWINGSをそのまま使う）
function localDrawingRecordsForJisseki(excludeId){
  return DRAWINGS.filter(function(d){return d.id!==excludeId}).map(function(d){
    var material=(d.mat||extractMaterialCode(d.name)||extractMaterialCode(d.size)||'').toUpperCase().trim();
    return{
      source:'drawing-dx',
      _id:'dx_'+d.id,
      drawingId:d.id,
      date:d.date||d.deadline||null,
      client:d.client||'',
      material:material,
      diameterMm:extractDiameterMmFromText(d.size)||extractDiameterMmFromText(d.name),
      sizeRaw:d.size||'',
      name:d.name||'',
      quoteNo:d.number||'',
      qty:(d.qty!=null&&d.qty!=='')?Number(d.qty):null,
      unitPrice:(d.price!=null&&d.price!=='')?Number(d.price):null,
      amount:null
    };
  });
}

function openJisseki(id){
  var d=DRAWINGS.find(function(x){return x.id===id});if(!d)return;
  S.jissekiOpen=true;S.jissekiLoading=true;S.jissekiError=null;S.jissekiResults=null;S.jissekiStats=null;S.jissekiDwgId=id;S.jissekiQuery=null;
  render();
  runJissekiSearch(d);
}
function closeJisseki(){S.jissekiOpen=false;render();}

async function runJissekiSearch(d){
  var toleranceRatio=0.2;
  var rawMat=d.mat||'';
  var query={
    diameterMm:extractDiameterMmFromText(d.size)||extractDiameterMmFromText(d.name),
    sizeRaw:d.size||'',
    material:rawMat||extractMaterialCode(d.name)||extractMaterialCode(d.size)||'',
    client:d.client||''
  };
  S.jissekiQuery=query;
  try{
    var yayoiRecs=fbEnabled?await fetchYayoiCandidates(query,toleranceRatio):[];
    var localRecs=localDrawingRecordsForJisseki(d.id);
    var all=yayoiRecs.concat(localRecs);
    var scored=all.map(function(r){
      var s=calcJissekiScore(query,r,toleranceRatio);
      return Object.assign({score:s.score,reasons:s.reasons},r);
    }).filter(function(r){return r.score>0}).sort(function(a,b){return b.score-a.score});
    S.jissekiResults=scored.slice(0,30);
    S.jissekiStats=jissekiPriceStats(S.jissekiResults);
    S.jissekiCandidateCount=all.length;
  }catch(e){
    console.error('jisseki search failed:',e);
    var msg=e&&e.message?e.message:String(e);
    S.jissekiError=msg.indexOf('index')>=0?'Firestoreの複合インデックスが未作成のようです（'+msg+'）':('検索に失敗しました: '+msg);
  }
  S.jissekiLoading=false;
  render();
}
