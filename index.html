function doSearch(src){
  S.sel=src;S.searching=true;S.results=null;S.tab='list';render();
  setTimeout(function(){
    S.results=DRAWINGS.filter(function(d){return d.id!==src.id}).map(function(d){
      var sim=calcSimilarity(src,d);
      return Object.assign({},d,{similarity:sim.score,reasons:sim.reasons});
    }).sort(function(a,b){return b.similarity-a.similarity});
    S.searching=false;render();
  },800);
}
function handleDropSearch(event){
  // Handle drag from card (id) - do similarity search
  var idStr=event.dataTransfer.getData('text/plain');
  if(idStr&&!isNaN(idStr)){
    var d=DRAWINGS.find(function(x){return x.id==idStr});
    if(d){doSearch(d);return}
  }
  // File drop - register as new drawing
  if(event.dataTransfer.files&&event.dataTransfer.files.length>0){
    var file=event.dataTransfer.files[0];
    // Open register modal with the file
    openRegister();
    setTimeout(function(){
      // Simulate file selection in register modal
      processRegisterFile(file);
    },200);
    return;
  }
  // Fallback: demo search
  demoSearch();
}

function processRegisterFile(f){
  if(!f)return;
  S.regName=f.name;
  S.regBlobUrl=URL.createObjectURL(f);
  S.regFileObj=f;
  var r=new FileReader();
  r.onload=function(ev){
    S.regPrev=ev.target.result;
    S.regIsPdf=f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf');
    S.ocrSt='running';
    S.ocrF={};
    render();
    if(S.regIsPdf){ocrFromPdf(ev.target.result)}else{runOCR(ev.target.result)}
  };
  r.readAsDataURL(f);
}
function demoSearch(){if(DRAWINGS.length)doSearch(DRAWINGS[Math.floor(Math.random()*DRAWINGS.length)])}

// Export all drawings for a client as multi-page PDF
async function exportClientPdf(clientName){
  // Find matching drawings
  var items=DRAWINGS.filter(function(d){return (d.client||'未指定')===clientName});
  if(items.length===0){alert('対象の図面がありません');return}
  
  // Check jsPDF availability
  var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!jsPDF){alert('PDF生成ライブラリが読み込まれていません。\nページを再読み込みしてください。');return}
  
  if(!confirm(clientName+'の図面 '+items.length+' 件を1つのPDFにまとめます。\nよろしいですか？\n\n※画像のない図面はスキップされます')) return;
  
  // Show progress
  var progressDiv=document.createElement('div');
  progressDiv.id='pdfExportProgress';
  progressDiv.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px 32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:9999;text-align:center;font-size:14px;min-width:280px';
  progressDiv.innerHTML='<div style="font-weight:600;margin-bottom:8px">📑 PDF生成中...</div><div id="pdfExportStatus" style="font-size:12px;color:#666">準備中</div>';
  document.body.appendChild(progressDiv);
  
  try{
    var doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    var pageW=doc.internal.pageSize.getWidth();
    var pageH=doc.internal.pageSize.getHeight();
    var margin=10;
    var added=0,skipped=0;
    
    for(var i=0;i<items.length;i++){
      var d=items[i];
      var statusEl=document.getElementById('pdfExportStatus');
      if(statusEl)statusEl.textContent=(i+1)+' / '+items.length+' — '+d.number;

      // 高品質ソースを優先: 原本PDF → 原本画像 → サムネイル
      var imgData=null;
      var pdfSrc=typeof scannedPdfs[d.id]==='string'?scannedPdfs[d.id]:null;
      if(pdfSrc){
        // PDFをpdf.jsで高解像度レンダリング（scale 2.5）
        imgData=await renderPdfPageForExport(pdfSrc,2.5);
      }
      if(!imgData&&scannedImages[d.id]){
        imgData=await loadImageForPdf(scannedImages[d.id]);
      }
      if(!imgData&&pdfThumbnails[d.id]){
        imgData=await loadImageForPdf(pdfThumbnails[d.id]);
      }
      if(!imgData){skipped++;continue}

      // Add new page (except for first)
      if(added>0)doc.addPage();

      // Header: drawing info
      doc.setFontSize(10);
      doc.setTextColor(60,60,60);
      doc.text(d.number+' — '+(d.name||''),margin,margin+4);
      doc.setFontSize(8);
      doc.setTextColor(120,120,120);
      var info=[d.mat,d.size,d.status].filter(Boolean).join(' | ');
      doc.text(info,margin,margin+9);

      // Calculate image size to fit page (with header space)
      var headerH=14;
      var availW=pageW-margin*2;
      var availH=pageH-margin*2-headerH;
      var ratio=imgData.w/imgData.h;
      var w=availW,hgt=availW/ratio;
      if(hgt>availH){hgt=availH;w=hgt*ratio}
      var x=(pageW-w)/2;
      var y=margin+headerH+(availH-hgt)/2;

      doc.addImage(imgData.src,'JPEG',x,y,w,hgt,'','SLOW');
      added++;
      
      // Yield to UI occasionally
      if(i%3===2)await new Promise(function(r){setTimeout(r,10)});
    }
    
    if(added===0){
      document.body.removeChild(progressDiv);
      alert('画像付き図面がありませんでした。\n図面を登録してから再度お試しください。');
      return;
    }
    
    // Save
    var safeName=clientName.replace(/[\\/:*?"<>|]/g,'_');
    var dateStr=new Date().toISOString().slice(0,10);
    doc.save(safeName+'_図面まとめ_'+dateStr+'.pdf');
    
    document.body.removeChild(progressDiv);
    alert('完了しました！\n\n収録: '+added+' 件\nスキップ: '+skipped+' 件（画像なし）');
  }catch(e){
    if(document.body.contains(progressDiv))document.body.removeChild(progressDiv);
    alert('PDF生成エラー: '+e.message);
    console.error(e);
  }
}

function renderPdfPageForExport(pdfDataUrl,scale){
  return new Promise(function(resolve){
    if(typeof pdfjsLib==='undefined'){resolve(null);return;}
    try{
      var raw=atob(pdfDataUrl.split(',')[1]);
      var arr=new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
      pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
        return pdf.getPage(1);
      }).then(function(page){
        var vp=page.getViewport({scale:scale||2.5});
        var cv=document.createElement('canvas');
        cv.width=vp.width;cv.height=vp.height;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
        return page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
          resolve({src:cv.toDataURL('image/jpeg',0.95),w:cv.width,h:cv.height});
        });
      }).catch(function(){resolve(null);});
    }catch(e){resolve(null);}
  });
}

function loadImageForPdf(src){
  return new Promise(function(resolve){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var maxDim=3000;
        var w=img.naturalWidth,h=img.naturalHeight;
        if(w>maxDim||h>maxDim){var r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r);}
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve({src:canvas.toDataURL('image/jpeg',0.95),w:w,h:h});
      }catch(e){resolve(null)}
    };
    img.onerror=function(){resolve(null)};
    img.src=src;
  });
}

// === ALRIT ZIP IMPORT ===
async function importAlritZip(e){
  var file=e.target.files[0];
  e.target.value='';
  if(!file)return;
  if(typeof JSZip==='undefined'){alert('JSZipライブラリが読み込まれていません。ページを再読み込みしてください。');return;}
  var prog=document.createElement('div');
  prog.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px 32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:9999;text-align:center;font-size:14px;min-width:280px';
  prog.innerHTML='<div style="font-weight:600;margin-bottom:8px">☁ ZIPを読み込み中...</div><div id="alritProgStatus" style="font-size:12px;color:#666">準備中</div>';
  document.body.appendChild(prog);
  try{
    // Shift-JIS形式のファイル名を正しくデコード
    var zip=await JSZip.loadAsync(file,{
      decodeFileName:function(bytes){
        try{return new TextDecoder('shift-jis').decode(bytes);}
        catch(e){try{return new TextDecoder('utf-8').decode(bytes);}catch(e2){return bytes.toString();}}
      }
    });
    // drawingフォルダ内のファイルのみ抽出
    var entries=[];
    var zipSkipped=[];
    zip.forEach(function(relPath,entry){
      if(entry.dir)return;
      var lower=relPath.toLowerCase();
      // "drawing"フォルダ配下のみ対象
      if(lower.indexOf('/drawing/')<0&&!lower.startsWith('drawing/'))return;
      if(lower.endsWith('.pdf')||lower.endsWith('.jpg')||lower.endsWith('.jpeg')||lower.endsWith('.png')||lower.endsWith('.bmp')||lower.endsWith('.tif')||lower.endsWith('.tiff')){
        // drawingフォルダ内でも、ファイル名から注文書・納品書・見積書と判断できるものは除外
        var dk=detectNonDrawingDoc(relPath.split('/').pop());
        if(dk){zipSkipped.push({name:relPath.split('/').pop(),kind:dk});return;}
        entries.push({path:relPath,entry:entry});
      }
    });
    if(entries.length===0){document.body.removeChild(prog);alert('ZIP内にPDF/画像ファイルが見つかりませんでした。\nALRITからダウンロードしたZIPを選択してください。');return;}
    var st=document.getElementById('alritProgStatus');
    if(st)st.textContent='0 / '+entries.length+' 件を読み込み中...';
    // bulkItemsに変換
    S.bulkItems=[];
    S.bulkSelected=0;
    for(var i=0;i<entries.length;i++){
      var ent=entries[i];
      if(st)st.textContent=(i+1)+' / '+entries.length+' — '+ent.path.split('/').pop();
      var blob=await ent.entry.async('blob');
      var lower=ent.path.toLowerCase();
      var mimeType=lower.endsWith('.pdf')?'application/pdf':(lower.endsWith('.png')?'image/png':'image/jpeg');
      // ファイル名をShift-JIS対応でデコード試みる
      var rawName=ent.path.split('/').pop();
      var fName=rawName;
      var fObj=new File([blob],fName,{type:mimeType});
      var isPdf=mimeType==='application/pdf';
      // ファイル名から図番を推定（例: 03380-1525H など）
      var numMatch=fName.match(/([A-Z0-9]+-[A-Z0-9]+)/i)||fName.match(/(\d{3,}[-_]\d+)/);
      var guessedNumber=numMatch?numMatch[1]:'';
      // ファイル名末尾の漢字・ひらがな・カタカナを得意先名として抽出
      var baseName=fName.replace(/\.[^.]+$/,'');
      var clientMatch=baseName.match(/[぀-ゟ゠-ヿ一-鿿㐀-䶿･-ﾟ]+$/);
      var guessedClient=clientMatch?clientMatch[0]:'';
      // 新しい得意先名であればMASTERSに自動追加
      if(guessedClient&&MASTERS.clients.indexOf(guessedClient)<0){
        MASTERS.clients.push(guessedClient);
      }
      var existingDup=guessedNumber?DRAWINGS.find(function(d){return d.number===guessedNumber}):null;
      var item={
        name:fName,
        file:fObj,
        preview:null,
        loading:true,
        checked:!existingDup,
        number:guessedNumber,
        itemName:baseName,
        client:existingDup?existingDup.client:guessedClient,
        mat:existingDup?existingDup.mat:'',
        cat:existingDup?existingDup.cat:'',
        isPdf:isPdf,
        duplicate:!!existingDup,
        status:'待機'
      };
      S.bulkItems.push(item);
      if(i%3===2)await new Promise(function(r){setTimeout(r,10)});
    }
    S.bulkSelected=S.bulkItems.length;
    document.body.removeChild(prog);
    // 一括登録モーダルを開く
    S.bulkOpen=true;
    render();
    // サムネイル非同期読込
    for(var j=0;j<S.bulkItems.length;j++){
      (function(idx){bulkLoadPreview(idx);})(j);
    }
    setTimeout(function(){
      var msg=S.bulkItems.length+' 件のファイルを読み込みました。\n図番・品名を確認して「一括登録」を押してください。';
      if(zipSkipped.length){
        var byKind={};zipSkipped.forEach(function(s){byKind[s.kind]=(byKind[s.kind]||0)+1;});
        msg+='\n\n※ 図面ではなく'+Object.keys(byKind).map(function(k){return k+' '+byKind[k]+'件'}).join('、')+'と判断し、'+zipSkipped.length+'件を対象から除外しました（スキャンフォルダ側でそのまま管理してください）。';
      }
      alert(msg);
    },200);
  }catch(err){
    if(document.body.contains(prog))document.body.removeChild(prog);
    alert('ZIPの読み込みに失敗しました:\n'+err.message);
  }
}

    }
  };
  input.click();
}

// === 画像指紋（パーセプチュアルハッシュ）による重複検知 ===
var _imgHashCache={};

function _calcHash(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    try{
      var cv=document.createElement('canvas');cv.width=8;cv.height=8;
      var ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,8,8);
      var d=ctx.getImageData(0,0,8,8).data;
      var gray=[],sum=0;
      for(var i=0;i<64;i++){var g=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];gray.push(g);sum+=g;}
      var avg=sum/64;
      cb(gray.map(function(v){return v>=avg?'1':'0'}).join(''));
    }catch(e){cb(null);}
  };
  img.onerror=function(){cb(null);};
  img.src=dataUrl;
}

function _hashSim(h1,h2){
  if(!h1||!h2||h1.length!==h2.length)return 0;
  var s=0;for(var i=0;i<h1.length;i++)if(h1[i]===h2[i])s++;
  return Math.round(s/h1.length*100);
}

function _findVisualMatches(hash,cb){
  if(!hash){cb([]);return;}
  var matches=[];
  var tasks=DRAWINGS.map(function(d){
    return new Promise(function(resolve){
      // キャッシュ済みならすぐ比較
      if(_imgHashCache[d.id]){
        var sim=_hashSim(hash,_imgHashCache[d.id]);
        if(sim>=85)matches.push({id:d.id,number:d.number,name:d.name,sim:sim});
        resolve();return;
      }
      // サムネイルから計算
      var src=pdfThumbnails[d.id]||scannedImages[d.id];
      if(!src){resolve();return;}
      _calcHash(src,function(h){
        if(h)_imgHashCache[d.id]=h;
        var sim=h?_hashSim(hash,h):0;
        if(sim>=85)matches.push({id:d.id,number:d.number,name:d.name,sim:sim});
        resolve();
      });
    });
  });
  Promise.all(tasks).then(function(){
    matches.sort(function(a,b){return b.sim-a.sim});
    cb(matches);
  });
}

function bulkLoadPreview(idx){
  var item=S.bulkItems[idx];
  if(!item)return;

  function onPreviewReady(previewDataUrl){
    item.preview=previewDataUrl;
    item.loading=false;
    if(S.bulkOpen)render();
    // 画像指紋で既存図面と比較
    _calcHash(previewDataUrl,function(hash){
      item._hash=hash;
      _findVisualMatches(hash,function(matches){
        if(matches.length>0){
          item.visualMatches=matches;
          // 図番ベースの重複でなくても画像一致ならチェック外し
          if(!item.duplicate){item.checked=false;S.bulkSelected=S.bulkItems.filter(function(i){return i.checked}).length;}
        }
        if(S.bulkOpen)render();
      });
    });
  }

  if(item.isPdf){
    var r=new FileReader();
    r.onload=function(ev){
      if(typeof pdfjsLib==='undefined'){item.loading=false;render();return;}
      try{
        var arr=atob(ev.target.result.split(',')[1]);
        var b=new Uint8Array(arr.length);
        for(var i=0;i<arr.length;i++)b[i]=arr.charCodeAt(i);
        pdfjsLib.getDocument({data:b}).promise.then(function(pdf){return pdf.getPage(1);}).then(function(page){
          var vp=page.getViewport({scale:0.3});
          var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
          return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){
            onPreviewReady(cv.toDataURL('image/jpeg',0.7));
          });
        }).catch(function(){item.loading=false;if(S.bulkOpen)render();});
      }catch(e){item.loading=false;if(S.bulkOpen)render();}
    };
    r.readAsDataURL(item.file);
  }else{
    var r=new FileReader();
    r.onload=function(ev){onPreviewReady(ev.target.result);};
    r.readAsDataURL(item.file);
  }
}

async function bulkSubmit(){
  var selected=S.bulkItems.filter(function(i){return i.checked});
  if(selected.length===0){alert('登録する図面を選択してください');return}
  var dupSelected=selected.filter(function(i){return i.duplicate});
  var msg=selected.length+' 件の図面を登録しますか？';
  if(dupSelected.length>0)msg+='\n\n⚠ うち '+dupSelected.length+' 件は既存の図番と重複しています。\nチェックを入れたまま登録すると上書きされます。';
  if(!confirm(msg)) return;
  
  var prog=document.createElement('div');
  prog.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px 32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:9999;text-align:center;font-size:14px;min-width:280px';
  prog.innerHTML='<div style="font-weight:600;margin-bottom:8px">📚 登録中...</div><div id="bulkProgStatus" style="font-size:12px;color:#666">0 / '+selected.length+'</div>';
  document.body.appendChild(prog);
  
  var added=0;
  try{
    for(var i=0;i<selected.length;i++){
      var it=selected[i];
      var st=document.getElementById('bulkProgStatus');
      if(st)st.textContent=(i+1)+' / '+selected.length+' — '+it.name;
      
      // Load file as data URL
      var dataUrl=await new Promise(function(resolve){
        var r=new FileReader();
        r.onload=function(ev){resolve(ev.target.result)};
        r.onerror=function(){resolve(null)};
        r.readAsDataURL(it.file);
      });
      if(!dataUrl)continue;

      // 重複の場合は既存レコードを上書き、新規の場合は追加
      var existRec=it.duplicate&&it.number?DRAWINGS.find(function(d){return d.number===it.number}):null;
      if(existRec){
        // ファイルデータのみ上書き（メタデータは保持）
        if(it.isPdf){
          scannedPdfs[existRec.id]=dataUrl;
          if(it.preview)pdfThumbnails[existRec.id]=it.preview;
        }else{
          scannedImages[existRec.id]=dataUrl;
        }
        existRec.scanned=true;
        existRec.imgVer=Date.now();
        added++;
      }else{
        var newDrawing={
          id:nextId++,
          number:it.number||('DWG-'+String(nextId).padStart(4,'0')),
          name:it.itemName||it.name,
          cat:it.cat||'未指定',
          mat:it.mat||'未指定',
          size:'未指定',
          client:it.client||'未指定',
          price:0,
          date:new Date().toISOString().slice(0,10),
          tags:[],
          shape:'plate',
          status:it.status||'待機',
          priority:'中',
          scanned:true,
          imgVer:Date.now()
        };
        if(it.isPdf){
          scannedPdfs[newDrawing.id]=dataUrl;
          if(it.preview)pdfThumbnails[newDrawing.id]=it.preview;
        }else{
          scannedImages[newDrawing.id]=dataUrl;
        }
        DRAWINGS.unshift(newDrawing);
        added++;
      }
      
      // Yield periodically
      if(i%2===1)await new Promise(function(r){setTimeout(r,30)});
    }
    
    saveAll();
    document.body.removeChild(prog);

// AI(Claude Opus 4.8) 精密読取り → 失敗時はCloud Vision+正規表現(runOCRVision)にフォールバック
function runOCR(img){
  var el=document.querySelector('.ocr-bar.run');
  if(el)el.innerHTML='<div class="dots" style="margin:0"><span></span><span></span><span></span></div>AIで精密読取り中...';
  aiExtractFields(img).then(function(res){
    if(res&&res.error)throw new Error(res.error);
    var fx=(res&&res.fields)||{};
    if(!(fx.number||fx.name||fx.material||fx.size||fx.client))throw new Error('AI応答が空');
    var f={};
    if(fx.number)f.number=fx.number;
    if(fx.name)f.name=matchExistingName(fx.name);
    if(fx.material)f.material=fx.material;
    if(fx.size)f.size=fx.size;
    if(fx.client)f.client=fx.client;
    if(fx.surface)f.surface=fx.surface;
    if(fx.tolerance)f.tolerance=fx.tolerance;
    if(fx.roughness)f.roughness=fx.roughness;
    if(fx.quantity)f.quantity=fx.quantity;
    var tg=[];if(fx.category)tg.push(fx.category);if(fx.material)tg.push(fx.material);if(fx.surface)tg.push(fx.surface);if(tg.length)f.tags=tg.join(', ');
    f.rawText='[AI Opus 4.8 読取]\n'+Object.keys(fx).filter(function(k){return fx[k]}).map(function(k){return k+': '+fx[k]}).join('\n');
    S.ocrF=f;S.ocrSt='done';render();
  }).catch(function(e){
    console.warn('AI読取失敗→Cloud Visionへ:',e&&e.message||e);
    runOCRVision(img);
  });

function aiExtractFields(img){
  var cu=(window.firebase&&firebase.auth)?firebase.auth().currentUser:null;
  return (cu?cu.getIdToken():Promise.resolve(null)).then(function(tok){
    if(!tok)throw new Error('ログイン情報を確認できません。再読み込みしてログインし直してください。');
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=ctrl?setTimeout(function(){ctrl.abort()},80000):null;
    return fetch('https://asia-northeast1-drawing-dx.cloudfunctions.net/extractFields',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({image:img,clients:(window.MASTERS&&MASTERS.clients)||[]}),
      signal:ctrl?ctrl.signal:undefined
    }).then(function(r){if(timer)clearTimeout(timer);return r.json();});
  });
}

function parseOCR(t){
  var f={},a=t.replace(/\s+/g,' '),l=t.split(/\n/);

  // 図面番号: DWG-xxxx, BP-40C26, MAA059736-L5-A 等
  var nm=a.match(/(?:DWG|BP|DR|NO|MAA|WAA|HAA|BAA|図番|文書番号|DRAWING[\s\-]*NO|DWG[\s\-]*NO)[.\-\s:：]*([A-Z0-9][A-Z0-9\-]{3,25})/i);
  if(nm)f.number=nm[1].replace(/\s/g,'-').toUpperCase();
  if(!f.number){var nm2=a.match(/\b([A-Z]{2,4}[-]?\d{3,8}[-][A-Z0-9]{1,5}(?:[-][A-Z0-9]{1,5})?)\b/i);if(nm2)f.number=nm2[1].toUpperCase()}
  if(!f.number){var nm3=a.match(/\b[A-Z]{1,4}[-\s]?\d{4,8}[A-Z0-9\-]{0,12}\b/i);if(nm3)f.number=nm3[0].replace(/\s/g,'-').toUpperCase()}

  // 材質: SUS304TP, SS400, S45C, SCM435, A5052, FC250 等（末尾複数文字対応）
  var matP=['SUS\\d{3}[A-Z]{0,3}','SS\\d{3}','S[0-9]{2}C','SCM\\d{3}','SNCM\\d{3}','A\\d{4}[A-Z]?','FC\\d{2,3}','FCD\\d{2,3}','SK[A-Z]?\\d{1,2}','SKD\\d{1,2}','SKH\\d{1,2}','SUJ\\d','C\\d{4}','SPHC','SPCC','SECC','SGCC'];
  var mm=a.match(new RegExp('('+matP.join('|')+')','i'));
  if(mm)f.material=mm[1].toUpperCase();

  // サイズ: φ80×t12, 150×80×t5, φ30×L200 等
  var sizePatterns=[
    /[φΦ]\s?\d+\.?\d*\s?[×xX]\s?[LltT]?\s?\d+\.?\d*/,
    /[φΦ]\s?\d+\.?\d*/,
    /\d{2,4}\.?\d*\s?[×xX]\s?\d{2,4}\.?\d*(\s?[×xX]\s?[tT]?\d{1,3}\.?\d*)?/
  ];
  for(var si=0;si<sizePatterns.length;si++){
    var sm=a.match(sizePatterns[si]);
    if(sm){f.size=sm[0].replace(/\s/g,'');break}
  }

  // 品名/名称: 「名称」「品名」「TITLE」「PART NAME FOR MFG」等の後のテキスト
  for(var i=0;i<l.length;i++){
    var ln=l[i].trim();
    if(ln.match(/名称|品名|品番|図面名|TITLE|PART[\s\-]*NAME/i)){
      var v=ln.replace(/名称|品名|品番|図面名|TITLE|PART[\s\-]*NAME[\s\-]*(?:FOR[\s\-]*MFG)?|[:：\s]/gi,'').trim();
      if(!v&&l[i+1])v=l[i+1].trim();
      if(v&&v.length>1&&v.length<50)f.name=v;
      break;
    }
  }

  // 取引先/客先
  for(var j=0;j<l.length;j++){
    var cl=l[j].trim();
    if(cl.match(/得意先|客先|発注元|発注者|CLIENT|CUSTOMER|会社/i)){
      var cv=cl.replace(/得意先|客先|発注元|発注者|CLIENT|CUSTOMER|会社|[:：\s]/gi,'').trim();
      if(!cv&&l[j+1])cv=l[j+1].trim();
      if(cv&&cv.length>1&&cv.length<30)f.client=cv;
      break;
    }
  }

  // 表面処理
  var surfaceMatch=a.match(/(メッキ|めっき|塗装|アルマイト|黒染|ニッケル|クロム|亜鉛|無電解|硬質クロム|四三酸化鉄)/i);
  if(surfaceMatch)f.surface=surfaceMatch[1];

  // 公差
  var tolMatch=a.match(/[±]\s?\d+\.?\d*/);
  if(tolMatch)f.tolerance=tolMatch[0].replace(/\s/g,'');

  // 表面粗さ
  var raMatch=a.match(/Ra\s?\d+\.?\d*/i);
  if(raMatch)f.roughness=raMatch[0].replace(/\s/g,'');

  // 数量
  var qtyMatch=a.match(/数量[:\s：]*(\d+)/);
  if(qtyMatch)f.quantity=qtyMatch[1];

  // カテゴリ自動判別
  var kw={"フランジ":"フランジ","シャフト":"シャフト","ブラケット":"ブラケット","プレート":"プレート","スペーサー":"スペーサー","カラー":"スペーサー","軸":"シャフト","ギア":"その他","歯車":"その他","バルブ":"フランジ","パイプ":"スペーサー","ボス":"スペーサー","ハウジング":"その他","ケース":"その他","カバー":"プレート","蓋":"プレート","FLANGE":"フランジ","SHAFT":"シャフト","BRACKET":"ブラケット","PLATE":"プレート","SPACER":"スペーサー","COLLAR":"スペーサー"};
  for(var k in kw){if(a.indexOf(k)>=0){f.category=kw[k];break}}

  // タグ
  var tg=[];
  if(f.category)tg.push(f.category);
  if(f.material)tg.push(f.material);
  if(f.surface)tg.push(f.surface);
  if(a.match(/穴|HOLE|タップ|TAP/i))tg.push('穴加工');
  if(a.match(/曲げ|BEND/i))tg.push('曲げ');
  if(a.match(/溶接|WELD/i))tg.push('溶接');
  if(a.match(/旋盤|LATHE/i))tg.push('旋盤');
  if(a.match(/フライス|MILL/i))tg.push('フライス');
  if(a.match(/研磨|研削|GRIND/i))tg.push('研磨');
  if(a.match(/放電|EDM|ワイヤ/i))tg.push('放電加工');
  if(a.match(/熱処理|焼入|焼戻|HRC/i))tg.push('熱処理');
  if(tg.length)f.tags=tg.join(', ');

  return f;
}
function levenshtein(a,b){var m=a.length,n=b.length,dp=[];for(var i=0;i<=m;i++){dp[i]=[i];}for(var j=0;j<=n;j++){dp[0][j]=j;}for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function findSimilarDrawing(of){
  if(!DRAWINGS||!DRAWINGS.length)return null;
  var num=(of.number||'').toUpperCase().replace(/[\s\-\.]/g,'');
  var name=(of.name||'').replace(/\s/g,'');
  var mat=(of.material||'').toUpperCase();
  var size=(of.size||'').replace(/\s/g,'');
  var best=null,bestScore=0;
  DRAWINGS.forEach(function(d){
    var score=0;
    var dNum=d.number.toUpperCase().replace(/[\s\-\.]/g,'');
    var dName=(d.name||'').replace(/\s/g,'');
    var dMat=(d.mat||'').toUpperCase();
    var dSize=(d.size||'').replace(/\s/g,'');
    if(num&&dNum){
      if(num===dNum)score+=100;
      else{var lev=levenshtein(num,dNum);var ratio=1-lev/Math.max(num.length,dNum.length);if(ratio>=0.85)score+=75;else if(ratio>=0.7)score+=40;}
    }
    if(name&&dName){
      if(name===dName)score+=60;
      else if(name.length>2&&(name.indexOf(dName)>=0||dName.indexOf(name)>=0))score+=35;
    }
    if(mat&&dMat&&mat===dMat)score+=20;
    if(size&&dSize&&size===dSize)score+=15;
    if(score>bestScore){bestScore=score;best=d;}
  });
  return bestScore>=65?{drawing:best,score:bestScore}:null;
}
function matchExistingName(ocrName){
  if(!ocrName||!DRAWINGS||!DRAWINGS.length)return ocrName;
  var found=DRAWINGS.find(function(d){return d.name&&d.name!==ocrName&&d.name.indexOf(ocrName)>=0});
  return found?found.name:ocrName;
}

}

function downloadDrawingFile(id){
  var d=DRAWINGS.find(function(x){return x.id===id});if(!d)return;
  var hasFile=scannedImages[id]||scannedBlobUrls[id]||scannedPdfs[id];
  if(!hasFile){
    // Firebaseからオンデマンド取得を試みる
    if(fbEnabled){
      var loadMsg=document.createElement('div');
      loadMsg.id='_dlLoadMsg';
      loadMsg.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px 28px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.25);z-index:9999;text-align:center;font-size:14px';
      loadMsg.innerHTML='<div style="margin-bottom:8px">⏳ 図面データを取得中...</div><div style="font-size:11px;color:#666">しばらくお待ちください</div>';
      document.body.appendChild(loadMsg);
      fbDB.collection('workspaces').doc('default').collection('images').doc(String(id)).get().then(function(snap){
        document.body.removeChild(loadMsg);
        if(snap.exists){
          var data=snap.data();
          if(data.pdf){scannedPdfs[id]=data.pdf;dbPut('meta','scannedPdfs',scannedPdfs);}
          if(data.image){scannedImages[id]=data.image;dbPut('images',String(id),data.image);}
          if(data.thumb){pdfThumbnails[id]=data.thumb;dbPut('meta','pdfThumbs',pdfThumbnails);}
          var nowHas=scannedImages[id]||scannedPdfs[id];
          if(nowHas){downloadDrawingFile(id);}
          else{alert('図面ファイルがありません\n（まだPCから同期されていない可能性があります）');}
        }else{alert('図面ファイルがありません\n（まだPCから同期されていない可能性があります）');}
      }).catch(function(e){
        if(document.body.contains(loadMsg))document.body.removeChild(loadMsg);
        alert('取得エラー: '+e.message);
      });
    }else{
      alert('図面ファイルがありません');
    }
    return;
  }
  var isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  // Resolve actual PDF data: scannedPdfs may be a data URL or just boolean true
  var pdfSrc=typeof scannedPdfs[id]==='string'?scannedPdfs[id]:null;
  // Fallback: scannedImages may hold PDF data for re-uploaded PDFs
  if(!pdfSrc&&scannedImages[id]&&scannedImages[id].indexOf('application/pdf')>=0)pdfSrc=scannedImages[id];
  if(pdfSrc){
    // PDF: convert to blob URL and open
    try{
      var raw=atob(pdfSrc.split(',')[1]);
      var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
      var blob=new Blob([arr],{type:'application/pdf'});
      var url=URL.createObjectURL(blob);
      if(isMobile){
        // iOS Safari: navigate directly (window.open blocked without user gesture)
        window.location.href=url;
      }else{
        downloadDataURL(url,d.number+'_'+d.name+'.pdf');
      }
    }catch(e){
      alert('PDFを開けません: '+e.message);
    }
  }else if(scannedPdfs[id]){
    // PDF flag set but data not available on this device (large PDF, not synced)
    alert('このPDFデータは登録したPCのみ保存されています。\nPCでQRコードを再生成してください。');
  }else{
    // Image
    var dataUrl=scannedImages[id]||scannedBlobUrls[id];
    if(!dataUrl){alert('画像がありません');return}
    if(isMobile){
      // Mobile: open in new tab
      var win=window.open(dataUrl,'_blank');
      if(!win){
        // Try blob URL approach
        try{
          var raw=atob(dataUrl.split(',')[1]);
          var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
          var mime=dataUrl.match(/data:(.*?);/);
          var blob=new Blob([arr],{type:mime?mime[1]:'image/png'});
          var url=URL.createObjectURL(blob);
          window.open(url,'_blank');
          setTimeout(function(){URL.revokeObjectURL(url)},120000);
        }catch(e){window.location.href=dataUrl}
      }
    }else{
      downloadDataURL(dataUrl,d.number+'_'+d.name+'.png');
    }
  }
}

function compressImage(dataUrl,cb,targetBytes){
  // データURL(base64)長が target 未満に収まるまで段階的に縮小・低画質化する。
  // Firestore 1ドキュメント1MB制限に対し、既定950KBで余裕を持たせる。
  var target=targetBytes||950*1024;
  var img=new Image();
  img.onload=function(){
    // 1回目は従来と同じ(長辺1200px/画質0.82)。以降は収まるまで段階的に圧縮を強める。
    var attempts=[
      {max:1200,q:0.82},{max:1200,q:0.72},{max:1000,q:0.7},{max:900,q:0.66},
      {max:800,q:0.62},{max:700,q:0.58},{max:600,q:0.52},{max:500,q:0.48}
    ];
    function renderAt(a){
      var w=img.width,h=img.height,max=a.max;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); // JPEGは透過非対応のため白地で塗る
      ctx.drawImage(img,0,0,w,h);
      return c.toDataURL('image/jpeg',a.q);
    }
    for(var i=0;i<attempts.length;i++){
      var out=renderAt(attempts[i]);
      if(out.length<target||i===attempts.length-1){cb(out);return;}
    }
  };
  img.onerror=function(){cb(dataUrl);}; // 読み込み失敗時は元データをそのまま返す
  img.src=dataUrl;
}

function uploadInspection(drawingId){
  var input=document.createElement('input');
  input.type='file';
  input.accept='application/pdf,image/*';
  input.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(f.size>30*1024*1024){
      alert('ファイルが大きすぎます（'+Math.round(f.size/1024/1024)+'MB）。\n30MB以内のファイルを選択してください。');
      return;
    }
    var reader=new FileReader();
    reader.onload=function(ev){
      var raw=ev.target.result;
      function store(data){
        var fileId=String(drawingId)+'_'+Date.now();
        var report={name:f.name,date:new Date().toISOString().slice(0,10),type:f.type,fileId:fileId,data:data};
        if(!inspectionReports[drawingId])inspectionReports[drawingId]=[];
        // 同名ファイルが既に存在する場合は古いものを削除してから追加
        inspectionReports[drawingId]=inspectionReports[drawingId].filter(function(x){return x.name!==f.name;});
        inspectionReports[drawingId].push(report);
        // Firestoreサブコレクションにファイルデータを保存（メイン文書は軽量に保つ）
        if(fbEnabled){
          fbDB.collection('workspaces').doc('insp_'+fileId).set({drawingId:drawingId,name:f.name,date:report.date,type:f.type,data:data})
            .catch(function(err){console.warn('inspection file save failed:',err.message);alert('検査報告書のクラウド同期に失敗しました（約'+Math.round(data.length/1024)+'KB）。\nこの端末には保存されていますが、他の端末では表示されない場合があります。\n通信状態を確認し、必要なら削除して撮り直し・再アップロードしてください。');});
        }
        saveAll();render();
      }
      if(f.type.startsWith('image/')){
        compressImage(raw,store);
      }else{
        // PDF: 700KB超は警告
        if(raw.length>950000){alert('PDFが大きすぎます（約'+Math.round(raw.length/1024)+'KB）。\n700KB以下のPDFか、画像形式でお試しください。');return;}
        store(raw);
      }
    };
    reader.readAsDataURL(f);
  };
  input.click();
}

// ===== 弥生 得意先突合 =====
function ymNormName(s){
  s=String(s||'');
  try{s=s.normalize('NFKC')}catch(e){}
  s=s.replace(/[\s　]/g,'');
  ['株式会社','有限会社','（株）','(株)','（有）','(有)','㈱','㈲','合同会社','合資会社'].forEach(function(t){s=s.split(t).join('')});
  s=s.replace(/[()（）・,、.。\-ー－_/／]/g,'');
  return s.toLowerCase();
}
function ymBigrams(s){var a=[];for(var i=0;i<s.length-1;i++)a.push(s.substr(i,2));return a;}
function ymSim(a,bgA,b,bgB){
  if(!a||!b)return 0;
  if(a===b)return 1;
  if(a.length<2||b.length<2)return a===b?1:0;
  var map={},inter=0;
  bgA.forEach(function(g){map[g]=(map[g]||0)+1});
  bgB.forEach(function(g){if(map[g]>0){inter++;map[g]--}});
  var d=2*inter/(bgA.length+bgB.length);
  if(a.indexOf(b)>=0||b.indexOf(a)>=0)d=Math.max(d,0.9+0.1*Math.min(a.length,b.length)/Math.max(a.length,b.length));
  return d;
}
function ymDxClients(){
  var m={};
  (MASTERS.clients||[]).forEach(function(c){if(c)m[c]=m[c]||0});
  DRAWINGS.forEach(function(d){if(d&&d.client)m[d.client]=(m[d.client]||0)+1});
  return m;
}
function computeYayoiMatch(){
  var ys=S.yayoiClients||[];
  ys.forEach(function(y){if(y._n==null){y._n=ymNormName(y.name);y._bg=ymBigrams(y._n);}});
  var nmap={};ys.forEach(function(y){if(nmap[y._n]==null)nmap[y._n]=y});
  var cmap=MASTERS.clientMap||{};
  var dx=ymDxClients();
  var rows=[];
  Object.keys(dx).forEach(function(name){
    var na=ymNormName(name),bgA=ymBigrams(na);
    var row={dx:name,use:dx[name]};
    if(cmap[name]){row.status='mapped';row.mapped=cmap[name];rows.push(row);return;}
    if(nmap[na]){var y=nmap[na];row.status='exact';row.score=1;row.ycode=y.code;row.yname=y.name;row.ymail=y.mail||'';row.alts=[];rows.push(row);return;}
    var scored=[];
    ys.forEach(function(y){scored.push([ymSim(na,bgA,y._n,y._bg),y])});
    scored.sort(function(a,b){return b[0]-a[0]});
    var best=scored[0];
    row.score=best?Math.round(best[0]*100)/100:0;
    row.status=row.score>=0.8?'near':(row.score>=0.55?'cand':'none');
    if(row.status!=='none'&&best){row.ycode=best[1].code;row.yname=best[1].name;row.ymail=best[1].mail||'';
      row.alts=scored.slice(1,5).filter(function(s){return s[0]>=0.5}).map(function(s){return{code:s[1].code,name:s[1].name,score:Math.round(s[0]*100)/100}});}
    else{row.ycode='';row.yname='';row.alts=[];}
    rows.push(row);
  });
  rows.forEach(function(r,i){r._i=i});
  return rows;
}
function handleYayoiExcel(ev){
  var f=ev.target.files[0];if(!f)return;
  if(typeof ExcelJS==='undefined'){alert('Excel読込ライブラリが未読込です。ページを再読み込みしてください。');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var wb=new ExcelJS.Workbook();
    wb.xlsx.load(e.target.result).then(function(){
      var ws=wb.worksheets[0];if(!ws){alert('シートが見つかりません');return;}
      function ct(v){if(v==null)return '';if(typeof v==='object'){if(v.text!=null)return String(v.text);if(v.result!=null)return String(v.result);if(v.richText)return v.richText.map(function(t){return t.text}).join('');if(v.hyperlink)return String(v.hyperlink);return '';}return String(v);}
      var rows=[];ws.eachRow({includeEmpty:false},function(row){rows.push(row.values)});
      var hi=-1,cCode=-1,cName=-1,cFuri=-1,cAddr=-1,cMail=-1;
      for(var i=0;i<Math.min(rows.length,20);i++){
        var texts=(rows[i]||[]).map(ct);
        var hasName=texts.some(function(t){return t.replace(/[\s　]/g,'')==='名称'});
        var hasCode=texts.some(function(t){return t.replace(/[\s　]/g,'').indexOf('コード')>=0});
        if(hasName&&hasCode){hi=i;
          texts.forEach(function(t,j){var s=t.replace(/[\s　]/g,'');if(cCode<0&&s.indexOf('コード')>=0)cCode=j;if(cName<0&&s==='名称')cName=j;if(cFuri<0&&s.indexOf('フリガナ')>=0)cFuri=j;if(cAddr<0&&s.indexOf('住所')>=0)cAddr=j;if(cMail<0&&s.indexOf('メールアドレス')>=0)cMail=j;});
          break;}
      }
      if(hi<0||cName<0){alert('「コード」「名称」の見出しが見つかりませんでした。\n弥生の得意先リストを「得意先リスト形式」でExcel書き出ししてください。');return;}
      var list=[];
      for(var r=hi+1;r<rows.length;r++){
        var vals=rows[r]||[];var name=ct(vals[cName]);if(!name.trim())continue;
        list.push({code:ct(vals[cCode]).trim(),name:name.trim(),furi:cFuri>=0?ct(vals[cFuri]).trim():'',addr:cAddr>=0?ct(vals[cAddr]).trim():'',mail:cMail>=0?ct(vals[cMail]).trim():''});
      }
      S.yayoiClients=list;S.yayoiMatch=computeYayoiMatch();render();
      alert('弥生 得意先 '+list.length+'件を読み込み、照合しました。');
    }).catch(function(err){alert('Excel読込エラー: '+err.message);});
  };
  reader.readAsArrayBuffer(f);
}

// ===== ゴミ箱（ソフトデリート） =====
// 削除された図面はTRASHに30日保持され、その間は復元できる。画像データも保持したままにする。
var TRASH_KEEP_DAYS=30;
function moveToTrash(ids){
  var now=Date.now();
  var by=(typeof AUTH_USER!=='undefined'&&AUTH_USER&&AUTH_USER.email)||'';
  var idSet={};ids.forEach(function(i){idSet[i]=1});
  DRAWINGS.forEach(function(d){if(idSet[d.id]){TRASH.unshift({d:d,deletedAt:now,deletedBy:by});markDeleteEdit(d.id,d.number);}});
  DRAWINGS=DRAWINGS.filter(function(d){return !idSet[d.id]});
}
// 完全削除（ローカルキャッシュ・IndexedDB・Firestoreの画像ドキュメントも消す）
function hardDeleteImages(id){
  delete scannedImages[id];delete scannedPdfs[id];delete scannedBlobUrls[id];delete pdfThumbnails[id];

function purgeOldTrash(){
  if(window._trashPurged)return;
  window._trashPurged=true;
  var cutoff=Date.now()-TRASH_KEEP_DAYS*24*3600*1000;
  var old=TRASH.filter(function(t){return t.deletedAt<cutoff});
  if(!old.length)return;
  old.forEach(function(t){hardDeleteImages(t.d.id);});
  TRASH=TRASH.filter(function(t){return t.deletedAt>=cutoff});
  saveAll(true);
}
function restoreFromTrash(idx){

  if(DRAWINGS.some(function(d){return d.id===t.d.id})){alert('同じIDの図面が既に存在するため復元できません');return;}
  delete pendingDeletes[String(t.d.id)]; // 復元するので「削除の再主張」を解除（再削除されないように）
  DRAWINGS.unshift(t.d);
  TRASH.splice(idx,1);

}

function renderPdfHighRes(dataUrl,callback,pageNum){
  // Render specified PDF page at high resolution (2000px+ width)
  pageNum=pageNum||S.annoPage||1;
  if(typeof pdfjsLib==='undefined'){callback(dataUrl);return}
  try{
    var raw=atob(dataUrl.split(',')[1]);
    var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
      return pdf.getPage(pageNum);
    }).then(function(page){
      var vp=page.getViewport({scale:1});
      var hiScale=Math.max(3,2000/vp.width);
      var sv=page.getViewport({scale:hiScale});
      var cv=document.createElement('canvas');cv.width=sv.width;cv.height=sv.height;
      var ctx=cv.getContext('2d');
      page.render({canvasContext:ctx,viewport:sv}).promise.then(function(){
        callback(cv.toDataURL('image/png'));
      }).catch(function(){callback(dataUrl)});
    }).catch(function(){callback(dataUrl)});
  }catch(e){callback(dataUrl)}
}

function renderAllPdfPages(dataUrl,callback){
  // Render ALL pages of PDF at high resolution
  if(typeof pdfjsLib==='undefined'){callback([dataUrl]);return}
  try{
    var raw=atob(dataUrl.split(',')[1]);
    var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
      var pages=[];var total=pdf.numPages;var done=0;
      for(var p=1;p<=total;p++){
        (function(pageNum){
          pdf.getPage(pageNum).then(function(page){
            var vp=page.getViewport({scale:1});
            var hiScale=Math.max(3,2000/vp.width);
            var sv=page.getViewport({scale:hiScale});
            var cv=document.createElement('canvas');cv.width=sv.width;cv.height=sv.height;
            page.render({canvasContext:cv.getContext('2d'),viewport:sv}).promise.then(function(){
              pages[pageNum-1]=cv.toDataURL('image/png');
              done++;if(done>=total)callback(pages);
            });
          });
        })(p);
      }
    }).catch(function(){callback([dataUrl])});
  }catch(e){callback([dataUrl])}
}

  S.annoStamps.forEach(function(st){
    var x=st.x,y=st.y;
    if(st.type==='stamp-quote'){
      s+='<rect x="'+(x-34)+'" y="'+(y-17)+'" width="68" height="34" fill="none" stroke="'+cl[st.type]+'" stroke-width="3" rx="2"/>';
      s+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="bold" fill="'+cl[st.type]+'">'+lb[st.type]+'</text>';
    }else{
      s+='<circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="'+cl[st.type]+'" stroke-width="3"/>';
      s+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="bold" fill="'+cl[st.type]+'">'+lb[st.type]+'</text>';
    }
  });

  S.annoTexts.forEach(function(t){

function saveAnnoImage(){
  var d=S.annoDrawing;if(!d)return;
  // 表示中の図面（#pdfBg または <img>）に注記レイヤー(#cv)を重ねて1枚に合成する。
  // 保存経路で再レンダリングすると白紙になる不具合があったため、
  // 「画面に見えているものをそのまま保存する」方式に統一する。
  var cv=document.getElementById('cv');
  function onScreenBg(){
    var pdfBg=document.getElementById('pdfBg');
    if(pdfBg&&pdfBg.width>0)return pdfBg; // PDF: 表示済みの現在ページ
    var bgImg=document.querySelector('#annoWrap img[data-scanimg]');
    if(bgImg&&bgImg.complete&&bgImg.naturalWidth>0)return bgImg; // 画像図面
    return null;
  }
  function output(bg){
    var W=(cv&&cv.width)||(bg&&(bg.width||bg.naturalWidth))||1400;
    var H=(cv&&cv.height)||(bg&&(bg.height||bg.naturalHeight))||990;
    var comp=document.createElement('canvas');comp.width=W;comp.height=H;
    var ctx=comp.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H); // 透過を避けて白地に
    if(bg)ctx.drawImage(bg,0,0,W,H);            // 図面（アスペクト比は#cvと一致）
    if(cv)ctx.drawImage(cv,0,0,W,H);            // 注記・スタンプ・単価など
    downloadDataURL(comp.toDataURL('image/png'),'annotated_'+d.number+'.png');
  }
  var bg=onScreenBg();
  if(bg){output(bg);return;}
  // 画面に図面が未表示の場合の保険: PDFなら高解像度で1ページ目を描画して合成
  var pdfSrc=getPdfSrc(d.id);
  if(pdfSrc){
    renderPdfPageForExport(pdfSrc,3).then(function(res){
      if(res&&res.src){var im=new Image();im.onload=function(){output(im)};im.onerror=function(){output(null)};im.src=res.src;}
      else output(null);
    });
    return;
  }
  output(null);
}

function drawStampsOnCtx(ctx,scX,scY,callback){
  var lb={'stamp-ok':'承認','stamp-ng':'差戻','stamp-check':'検査済','stamp-quote':'見積依頼'};
  var cl={'stamp-ok':'#1B8C65','stamp-ng':'#C03030','stamp-check':'#185FA5','stamp-quote':'#B06E15'};
  S.annoStamps.forEach(function(s){
    var x=s.x*scX,y=s.y*scY,sz=Math.max(scX,scY);
    ctx.save();ctx.strokeStyle=cl[s.type];ctx.lineWidth=Math.round(3*sz);
    ctx.font='bold '+Math.round(16*sz)+'px sans-serif';ctx.fillStyle=cl[s.type];
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(s.type==='stamp-quote'){
      var w=Math.round(68*sz),h2=Math.round(34*sz);
      ctx.strokeRect(x-w/2,y-h2/2,w,h2);
    }else{
      ctx.beginPath();ctx.arc(x,y,Math.round(28*sz),0,Math.PI*2);ctx.stroke();
    }
    ctx.fillText(lb[s.type],x,y);
    ctx.restore();
  });
  // Draw text annotations
  S.annoTexts.forEach(function(t){
    var x=t.x*scX,y=t.y*scY,sz=Math.max(scX,scY);
    ctx.save();
    ctx.font='bold '+Math.round(14*sz)+'px sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    var metrics=ctx.measureText(t.text);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillRect(x-2*sz,y-2*sz,metrics.width+4*sz,Math.round(16*sz)+4*sz);
    ctx.fillStyle=t.color||'#C03030';
    ctx.fillText(t.text,x,y);
    ctx.restore();
  });
  if(callback)callback();
}

function downloadDataURL(url,filename){
  var a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);if(url.startsWith('blob:'))URL.revokeObjectURL(url)},100);
}

function printHTML(html){
  var iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;left:-9999px;top:0;width:800px;height:600px;border:none';
  document.body.appendChild(iframe);
  var doc=iframe.contentDocument||iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  setTimeout(function(){
    try{iframe.contentWindow.print()}catch(e){
      var blob=new Blob([html],{type:'text/html;charset=utf-8'});
      downloadDataURL(URL.createObjectURL(blob),'print_'+Date.now()+'.html');
    }
    setTimeout(function(){document.body.removeChild(iframe)},1000);
  },300);
}

  st.textContent=[
    '#aiFab{position:fixed;right:20px;bottom:20px;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:none;box-shadow:var(--shadow-lg);cursor:pointer;font-size:24px;display:none;align-items:center;justify-content:center;transition:transform .15s}',
    '#aiFab:hover{transform:scale(1.06)}',
    '#aiPanel{position:fixed;right:20px;bottom:88px;z-index:95;width:400px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 120px);background:var(--bg2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}',
    '#aiPanel.open{display:flex;animation:aiPop .18s ease}',
    '@keyframes aiPop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}',
    '#aiHead{padding:14px 16px;background:var(--bg3);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}',
    '#aiHead .t{font-weight:700;font-size:14px;color:var(--tx);flex:1}',
    '#aiHead .s{font-size:11px;color:var(--tx3)}',
    '#aiHead button{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px}',
    '#aiHead button:hover{background:var(--bd);color:var(--tx)}',
    '#aiBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}',
    '.aiMsg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}',
    '.aiMsg.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}',
    '.aiMsg.a{align-self:flex-start;background:var(--bg3);color:var(--tx);border-bottom-left-radius:4px}',
    '.aiMsg.a b{color:var(--ac3)}',
    '.aiMsg.a code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--am)}',
    '.aiErr{align-self:stretch;text-align:center;background:var(--rd2);border:1px solid var(--rd);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--rd);line-height:1.7}',
    '.aiBusyLbl{color:var(--tx3);font-size:12px;margin-left:6px}',
    '.aiHint{align-self:center;text-align:center;color:var(--tx3);font-size:12px;line-height:1.7;padding:8px}',
    '.aiChip{display:inline-block;margin:3px;padding:6px 11px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;color:var(--tx2);font-size:12px;cursor:pointer}',
    '.aiChip:hover{border-color:var(--ac);color:var(--ac3)}',
    '#aiFoot{padding:10px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end}',
    '#aiInput{flex:1;resize:none;max-height:100px;padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;font-family:var(--font);outline:none;line-height:1.5}',
    '#aiSend{width:38px;height:38px;flex:none;border:none;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;font-size:16px}',
    '#aiSend:disabled{opacity:.4;cursor:default}',
    '.aiDots span{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--tx3);border-radius:50%;animation:aiBlink 1.2s infinite both}',
    '.aiDots span:nth-child(2){animation-delay:.2s}.aiDots span:nth-child(3){animation-delay:.4s}',
    '@keyframes aiBlink{0%,80%,100%{opacity:.2}40%{opacity:1}}',
    '#aiAttachBar{padding:0 10px}',
    '.aiAttach{display:flex;align-items:center;gap:8px;background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:7px 10px;margin-top:8px;font-size:12px;color:var(--ac3)}',
    '.aiAttach img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}',
    '.aiAttach .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.aiAttach .x{cursor:pointer;color:var(--tx2);font-size:15px;padding:0 4px}.aiAttach .x:hover{color:var(--rd)}',
    '@media(max-width:500px){#aiPanel{right:8px;left:8px;width:auto;bottom:80px;height:calc(100vh - 100px)}#aiFab{right:14px;bottom:14px}}'
  ].join('');
  document.head.appendChild(st);

  // DOM生成
  var fab=document.createElement('button');
  fab.id='aiFab';fab.title='AIに相談';fab.innerHTML='&#128172;';
  var panel=document.createElement('div');panel.id='aiPanel';
  panel.innerHTML=
    '<div id="aiHead"><div><div class="t">AI相談</div><div class="s">全図面データを見て回答</div></div><button id="aiClear" title="会話をクリア">&#8635;</button><button id="aiClose" title="閉じる">&times;</button></div>'+
    '<div id="aiBody"></div>'+
    '<div id="aiAttachBar"></div>'+
    '<div id="aiFoot"><textarea id="aiInput" rows="1" placeholder="図面や加工について質問..."></textarea><button id="aiSend">&#10148;</button></div>';
  document.body.appendChild(fab);
  document.body.appendChild(panel);

  var body=panel.querySelector('#aiBody');
  var input=panel.querySelector('#aiInput');
  var sendBtn=panel.querySelector('#aiSend');
  var attachEl=panel.querySelector('#aiAttachBar');
  var pendingImg=null, pendingLabel='';

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(s){
    var h=esc(s);
    h=h.replace(/^#{1,4}\s+(.+)$/gm,'<b>$1</b>');       // 見出し → 太字
    h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');           // **太字**
    h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');       // `コード`
    return h;
  }

  var lastError=null, busyLabel='考え中...';

  function updateSub(){
    try{var n=(window.DRAWINGS||[]).length;panel.querySelector('#aiHead .s').textContent='全'+n+'件の図面データを参照';}catch(e){}
  }

  function renderMsgs(){
    updateSub();
    var h='';
    if(msgs.length===0&&!lastError){
      h='<div class="aiHint">図面データをもとに何でも聞いてください。<br>例えば:</div>'+
        '<div style="text-align:center">'+
        ['SUS304で似た図面はある?','取引先ごとの件数を教えて','製造中の案件を一覧にして','この形状の見積り目安は?']
          .map(function(q){return '<span class="aiChip" data-q="'+esc(q)+'">'+esc(q)+'</span>'}).join('')+
        '</div>';
    }else{
      msgs.forEach(function(m){h+='<div class="aiMsg '+(m.role==='user'?'u':'a')+'">'+(m.role==='user'?esc(m.content):fmt(m.content))+'</div>'});
      if(busy)h+='<div class="aiMsg a"><span class="aiDots"><span></span><span></span><span></span></span><span class="aiBusyLbl">'+esc(busyLabel)+'</span></div>';
      if(lastError)h+='<div class="aiErr">⚠ '+esc(lastError)+'<br><span class="aiChip" id="aiRetry">↻ 再送信</span></div>';
    }
    body.innerHTML=h;
    body.querySelectorAll('.aiChip[data-q]').forEach(function(c){c.onclick=function(){input.value=c.getAttribute('data-q');send()}});
    var rt=body.querySelector('#aiRetry');
    if(rt)rt.onclick=function(){send()};
    body.scrollTop=body.scrollHeight;
  }

  function drawingsPayload(){
    try{
      return (window.DRAWINGS||[]).map(function(d){
        return {number:d.number,name:d.name,mat:d.mat,size:d.size,client:d.client,price:d.price,status:d.status,cat:d.cat};
      });
    }catch(e){return []}
  }

  // ===== 図面画像の取り出し（AIに見せる用） =====
  function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=src})}
  function toJpeg(imgEl,max){var w=imgEl.naturalWidth||imgEl.width,h=imgEl.naturalHeight||imgEl.height;var sc=Math.min(1,max/Math.max(w,h));var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(imgEl,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',0.85)}
  function fallbackImg(id){try{return (window.pdfThumbnails||{})[id]||null}catch(e){return null}}
  function getDrawingImageForAI(id){
    return new Promise(function(resolve){
      try{
        var pdfSrc=(typeof getPdfSrc==='function')?getPdfSrc(id):null;
        if(pdfSrc&&typeof pdfjsLib!=='undefined'){
          var raw=atob(pdfSrc.split(',')[1]);var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
          pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){return pdf.getPage(1)}).then(function(page){
            var vp0=page.getViewport({scale:1});var scale=Math.min(3,1800/Math.max(vp0.width,vp0.height));var vp=page.getViewport({scale:scale});
            var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
            return page.render({canvasContext:cx,viewport:vp}).promise.then(function(){resolve(cv.toDataURL('image/jpeg',0.85))});
          }).catch(function(){resolve(fallbackImg(id))});
          return;
        }
        var si=(typeof scannedImages!=='undefined'?scannedImages:{})[id];
        if(si&&si.indexOf('application/pdf')<0){loadImg(si).then(function(im){resolve(toJpeg(im,1800))}).catch(function(){resolve(fallbackImg(id))});return;}
        resolve(fallbackImg(id));
      }catch(e){resolve(null)}
    });
  }

  function renderAttach(){
    if(pendingImg){
      attachEl.innerHTML='<div class="aiAttach"><img src="'+pendingImg+'"><span class="lbl">🖼 '+esc(pendingLabel||'図面')+' を添付中</span><span class="x" title="外す">&times;</span></div>';
      attachEl.querySelector('.x').onclick=function(){pendingImg=null;pendingLabel='';renderAttach()};
    }else{attachEl.innerHTML=''}
  }

  function openWithDrawing(id){
    var d=(window.DRAWINGS||[]).find(function(x){return x.id===id});
    pendingLabel=(d?((d.number||'')+' '+(d.name||'')):('図面#'+id)).trim();
    pendingImg=null;
    panel.classList.add('open');renderMsgs();
    attachEl.innerHTML='<div class="aiAttach"><span class="lbl">🖼 '+esc(pendingLabel)+' の画像を準備中...</span></div>';
    getDrawingImageForAI(id).then(function(img){
      if(!img){pendingLabel='';attachEl.innerHTML='';alert('この図面には送れる画像がありません（画像・PDFが未登録）。');return;}
      pendingImg=img;renderAttach();setTimeout(function(){input.focus()},50);
    });
  }
  window.aiAskAboutDrawing=openWithDrawing;
  window.getDrawingImageForAI=getDrawingImageForAI; // AI読取(extractFields)から図面画像レンダラを再利用

  function send(){
    var t=(input.value||'').trim();
    if((!t&&!pendingImg)||busy)return;
    if(!t&&pendingImg)t='この図面について、寸法・公差・材質・注記など読み取れることを教えてください。';
    lastError=null;
    msgs.push({role:'user',content:t});
    input.value='';input.style.height='auto';
    var imgToSend=pendingImg, labelToSend=pendingLabel; // 添付は次の1問に付けて送る
    pendingImg=null;pendingLabel='';renderAttach();
    busy=true;sendBtn.disabled=true;
    busyLabel=imgToSend?'図面を確認中...':'考え中...';
    renderMsgs();

    // 失敗時: 会話履歴を汚さず、質問と添付を元に戻して再送できるようにする
    function fail(msg){
      busy=false;sendBtn.disabled=false;
      var last=msgs[msgs.length-1];
      if(last&&last.role==='user'){msgs.pop();input.value=last.content;}
      if(imgToSend){pendingImg=imgToSend;pendingLabel=labelToSend;renderAttach();}
      lastError=msg;
      renderMsgs();
    }

    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=ctrl?setTimeout(function(){ctrl.abort()},125000):null;

    // ログイン中の本人証明トークンを取得（サーバー側で許可メールか検証される）
    var tokenP;
    try{
      var cu=(window.firebase&&firebase.auth)?firebase.auth().currentUser:null;
      tokenP=cu?cu.getIdToken():Promise.resolve(null);
    }catch(e){tokenP=Promise.resolve(null)}

    tokenP.then(function(tok){
      if(!tok){if(timer)clearTimeout(timer);fail('ログイン情報を確認できません。ページを再読み込みしてログインし直してください。');return null;}
      return fetch(CHAT_URL,{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
        body:JSON.stringify({messages:msgs,drawings:drawingsPayload(),image:imgToSend}),
        signal:ctrl?ctrl.signal:undefined
      });
    }).then(function(r){
      if(!r)return null;
      return r.text().then(function(tx){
        var d=null;try{d=JSON.parse(tx)}catch(e){}
        return {ok:r.ok,status:r.status,data:d};
      });
    }).then(function(res){
      if(!res)return; // トークン無しで中断済み（failで案内表示済み）
      if(timer)clearTimeout(timer);
      if(res.ok&&res.data&&res.data.text){
        busy=false;sendBtn.disabled=false;
        msgs.push({role:'assistant',content:res.data.text});
        renderMsgs();
      }else{
        fail((res.data&&res.data.error)||('サーバーエラーが発生しました (HTTP '+res.status+')'));
      }
    }).catch(function(e){
      if(timer)clearTimeout(timer);
      if(e&&e.name==='AbortError')fail('時間内に応答がありませんでした。もう一度お試しください。');
      else fail('サーバーに接続できません。ネットワークを確認して再送信してください。');
    });
  }

  input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
  // PCはEnterで送信（Shift+Enterで改行）。スマホはEnter=改行、送信はボタンで。
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!(typeof isMobileDevice==='function'&&isMobileDevice())){e.preventDefault();send()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('open'))panel.classList.remove('open')});
  sendBtn.onclick=send;
  panel.querySelector('#aiClose').onclick=function(){panel.classList.remove('open')};
  panel.querySelector('#aiClear').onclick=function(){msgs=[];pendingImg=null;pendingLabel='';lastError=null;renderAttach();renderMsgs()};
  fab.onclick=function(){panel.classList.toggle('open');if(panel.classList.contains('open')){renderMsgs();setTimeout(function(){input.focus()},50)}};

  // ログイン後にだけボタンを表示
  var iv=setInterval(function(){
    if(window._bootStarted&&(typeof AUTH_USER==='undefined'||AUTH_USER)){
      fab.style.display='flex';clearInterval(iv);
    }
  },500);
})();
</script>
</body>
</html>
